** It points directly at the places where the speaker experiences **limited choice**, which the authors identify as the heart of impoverished models. Their reasoning: either you or someone you know *has* done the thing, so the world allows it, and the limit must live in the speaker's map. The question invites the speaker to look at the blocker.\n\n**Style.** Ask with curiosity, not challenge. \"What stops you?\" is a real question, and a surprising answer often reveals the cause.\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]] · *Pair:* [[meta-model/deletion/modal-operators-of-necessity]] · *Bridge to:* [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/deletion/modal-operators-of-necessity", "meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "meta-model/deletion/unspecified-slots", "domain": "meta-model/deletion", "slug": "unspecified-slots", "title": "Unspecified slots", "entry_type": "technique", "tags": ["deletion", "simple-deletion", "verbs"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** The plain case of deletion: a verb appears with fewer participants than it can take.\n\n**Three-step test.**\n1. Listen to the sentence.\n2. Pick out each verb. (Check each one separately; each can hide its own gap.)\n3. Ask: can I make a well-formed sentence with the *same* verb and **more** noun phrases? If so, the original is incomplete.\n\n**Complete or incomplete? (new examples)**\n\n| Sentence | Verdict | Why |\n|---|---|---|\n| *Mina closed the window.* | complete | who closed, what was closed |\n| *The window was closed.* | incomplete | by whom is gone |\n| *I'm uneasy.* | incomplete | uneasy about what? |\n| *We argued.* | incomplete | with whom, about what? |\n| *Lena wanted to leave and told him so.* | one gap | *wanted to leave what? (a place, a job...)* is optional but *told him* is complete |\n\nWhen a sentence has several verbs, each can carry its own deletion: *\"I promised I'd try\"* has two (promised to whom, try what).\n\n**Recovering question.** Ask directly for the missing piece:\n\n| Said | Ask |\n|---|---|\n| *I'm uneasy.* | uneasy about whom or what? |\n| *They were furious.* | furious with whom? about what? |\n| *She decided.* | decided what? |\n| *I told them.* | told them what? |\n| *Nobody supports me.* | supports you in what? |\n\n**Related traps.**\n- *Passives* delete the doer: \"Mistakes were made.\" (by whom?)\n- *Nominalized subjects* delete several slots at once: \"Communication is difficult\" (whose communication, to whom, about what?). See [[meta-model/distortion/distortion-patterns-at-a-glance]].\n\n**Remember.** Deletion is not wrong: \"I ate\" is fine. Probe only where the person feels stuck or the missing part matters. And if the answer is blank, the gap may exist in their *own* picture, which is where the useful work begins ([[meta-model/accept-ask-or-guess]]).\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]]", "links": ["meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/accept-ask-or-guess", "meta-model/deletion/deletion-patterns-at-a-glance"]}, {"id": "meta-model/distortion/cause-and-effect", "domain": "meta-model/distortion", "slug": "cause-and-effect", "title": "Cause and effect", "entry_type": "pattern", "tags": ["causation", "responsibility", "emotion", "semantic-ill-formedness"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** A sentence in which one person (or event) is said to *cause* another person's feeling or inner state, with no stated mechanism and no choice for the person who feels it.\n\n**Two shapes.**\n- **A.** *X [causes] Y to feel [emotion].* \"My boss makes me anxious.\"\n- **B.** *X's [action] [causes] Y.* \"Their silence frustrates me.\"\n\nX and Y refer to different people. If they are the same person, the sentence is fine (*\"I'm happy that I'm going to Lisbon\"* is only a reported feeling).\n\n**Paraphrase test.**\n- Can the sentence be rewritten as *\"X makes Y feel [emotion]\"* with the same meaning? If yes, it is this pattern.\n- *\"You bore me\"* → *\"You make me feel bored.\"* Same meaning, so cause-and-effect.\n- *\"I'm sad because you left\"* → *\"Your leaving makes me feel sad.\"*\n\n**The book's claim.** A person cannot directly *produce* a feeling in another. One person acts, the other responds, and between the two there is a process in the responder's own model. The authors call such sentences **semantically ill-formed**: they describe something they consider impossible, and so they point to a spot where the speaker's model is giving away choice.\n\n**Caution.** This is an observation about how people model experience, not a rule that no behaviour affects anyone. The aim is to ask about the process, not to deny the effect.\n\n**Questions.**\n- *How, specifically, does she do that?*\n- *Does it always make you feel that way?* If not: *What is different the times it doesn't?*\n\n**Why it works.** Answers reveal the actual steps: what the speaker notices, how it is interpreted, what they tell themselves. Those steps are choice points.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Related:* [[meta-model/distortion/implied-causatives]], [[meta-model/generalization/incompletely-specified-verbs]]", "links": ["meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/implied-causatives", "meta-model/generalization/incompletely-specified-verbs"]}, {"id": "meta-model/distortion/distortion-patterns-at-a-glance", "domain": "meta-model/distortion", "slug": "distortion-patterns-at-a-glance", "title": "Distortion patterns at a glance", "entry_type": "framework", "tags": ["distortion", "overview", "index"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Idea.** Distortion twists a piece of experience so that it limits what the speaker can do. In speech it shows up as sentences that present a process as a thing, assume things as given, or link two events by force.\n\n| Pattern | What it sounds like | Core question |\n|---|---|---|\n| [[meta-model/distortion/nominalization]] | *\"The rejection hurt.\"* | Who is rejecting whom, and how? |\n| [[meta-model/distortion/presuppositions-in-sentences]] | *\"I regret that she lied.\"* | (accept it, then ask how, specifically) |\n| [[meta-model/distortion/cause-and-effect]] | *\"He makes me nervous.\"* | How, specifically, does he do that? |\n| [[meta-model/distortion/implied-causatives]] | *\"I'd call but she's busy.\"* | Always? Then if she weren't busy, you would? |\n| [[meta-model/distortion/mind-reading]] | *\"They think I'm slow.\"* | How do you know? |\n| [[meta-model/distortion/lost-performative]] | *\"It's wrong to ask.\"* | Wrong for whom? By whose rule? |\n\n**What the six share.** Each moves something that belongs to the speaker (a process, an assumption, a choice, a belief) *outside* the speaker, so it looks like a fact of the world. The questions bring it back to where it came from.\n\n*Part of:* [[meta-model/the-meta-model]] · *Compare:* [[meta-model/deletion/deletion-patterns-at-a-glance]], [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["meta-model/distortion/nominalization", "meta-model/distortion/presuppositions-in-sentences", "meta-model/distortion/cause-and-effect", "meta-model/distortion/implied-causatives", "meta-model/distortion/mind-reading", "meta-model/distortion/lost-performative", "meta-model/the-meta-model", "meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "meta-model/distortion/implied-causatives", "domain": "meta-model/distortion", "slug": "implied-causatives", "title": "Implied causatives", "entry_type": "pattern", "tags": ["causation", "but", "limits", "reversal"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** The word **but** often conceals a cause-and-effect claim: *something I want is blocked*, or *something I don't want is forced on me*, by some condition.\n\n**Two forms.**\n- *I want [X] but [Y].* \"I want to switch teams but my manager needs me.\" Y blocks X.\n- *I don't want [X] but [Y].* \"I don't want to work late but the client expects it.\" Y forces X.\n\nIn logical shorthand, *X but Y* means *X and not-X because Y.* The \"not-X\" has been deleted.\n\n```svg\n<svg viewBox=\"0 0 660 260\" role=\"img\" aria-label=\"Implied causative X but Y expanded and reversed\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"200\" height=\"56\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"120.0\" y=\"44.05\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">I want to apply<\/text><text x=\"120.0\" y=\"61.05\" text-anchor=\"middle\" font-size=\"13\">but my schedule is full<\/text><line x1=\"220\" y1=\"48\" x2=\"258\" y2=\"48\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"260\" y=\"20\" width=\"170\" height=\"56\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"345.0\" y=\"36.2\" text-anchor=\"middle\" font-size=\"12\">I want to apply<\/text><text x=\"345.0\" y=\"52.2\" text-anchor=\"middle\" font-size=\"12\">and I'm not applying<\/text><text x=\"345.0\" y=\"68.2\" text-anchor=\"middle\" font-size=\"12\">because it's full<\/text><line x1=\"430\" y1=\"48\" x2=\"468\" y2=\"48\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"470\" y=\"20\" width=\"170\" height=\"56\" rx=\"9\" fill=\"#3aa17e\" fill-opacity=\".14\" stroke=\"#3aa17e\" stroke-width=\"1.6\"/><text x=\"555.0\" y=\"35.875\" text-anchor=\"middle\" font-size=\"12.5\">If the schedule<\/text><text x=\"555.0\" y=\"52.375\" text-anchor=\"middle\" font-size=\"12.5\">weren't full,<\/text><text x=\"555.0\" y=\"68.875\" text-anchor=\"middle\" font-size=\"12.5\">I would apply?<\/text><text x=\"120\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">what is said<\/text><text x=\"345\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">the full form<\/text><text x=\"555\" y=\"100\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">the reversal to offer<\/text><rect x=\"60\" y=\"140\" width=\"540\" height=\"90\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"172.55\" text-anchor=\"middle\" font-size=\"13\">The speaker's answer shows whether the block is really the cause.<\/text><text x=\"330.0\" y=\"189.55\" text-anchor=\"middle\" font-size=\"13\">Yes: ask how the cause works, specifically.<\/text><text x=\"330.0\" y=\"206.55\" text-anchor=\"middle\" font-size=\"13\">No: ask what else is in the way, or what would change.<\/text><\/svg>\n```\n\n**Three ways to respond.**\n1. **Accept it and test \"always\".** *Do you always stay late when the client expects it?* Find the times it does not hold, then ask what differs.\n2. **Accept it and ask for the mechanism.** *How, specifically, does the client's expectation make you work late?*\n3. **Reverse it.** Expand to *X and not-X because Y*, then offer back: *If your manager didn't need you, you would switch teams?* A \"yes\" confirms the real obstacle. A hesitation means the block was something else.\n\n**A fourth move (add necessity).** Feed the claim back with *necessarily* in it: *\"Their expectation necessarily makes you stay late?\"* Exaggeration invites the speaker to explore how it is not necessary.\n\n**Why it is valuable.** The speaker usually thinks they have no choice. The reversal brings the real cause or the real choice into view, and frequently lets them recognise their own continuing decision.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Related:* [[meta-model/distortion/cause-and-effect]]", "links": ["meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/cause-and-effect"]}, {"id": "meta-model/distortion/lost-performative", "domain": "meta-model/distortion", "slug": "lost-performative", "title": "Lost performative", "entry_type": "pattern", "tags": ["performative", "value-judgments", "rules", "beliefs"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** A **value judgment stated as a fact about the world**, with the speaker who holds it gone from the sentence.\n\n*\"It's wrong to ask for help.\"* *\"Only fools trust strangers.\"* *\"Crying is weak.\"*\n\nIn the full structure there is a higher sentence, *\"I say to you that...\"* (the **performative**), which names who is claiming this. In speech it is usually deleted, so a personal rule sounds like a law of nature.\n\n**Cue words.** *good, bad, right, wrong, correct, true, false, crazy, sick, stupid, only (as in \"the only way\")*, and the like.\n\n**Restoring it.** The aim is not to make people prefix every sentence, but to *hear* the claim as coming from their model: *\"I believe it's wrong for me to ask for help\"*, with a time and a source attached.\n\n**Questions.**\n- *Wrong for whom?*\n- *According to whom?*\n- *What happens if someone does it?*\n- *How did you come to hold that?*\n\n**What changes.** Once it is heard as \"my rule, from my experience\", it can be examined, adjusted or placed in context. A rule in the speaker's *model* can change; a rule in the *world* cannot.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Related:* [[meta-model/deletion/modal-operators-of-necessity]]", "links": ["meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/deletion/modal-operators-of-necessity"]}, {"id": "meta-model/distortion/mind-reading", "domain": "meta-model/distortion", "slug": "mind-reading", "title": "Mind reading", "entry_type": "pattern", "tags": ["mind-reading", "assumptions", "verification"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** The speaker claims to know another person's thoughts or feelings without saying how they learned it.\n\n**Examples.**\n- *\"The committee thinks my proposal is boring.\"*\n- *\"I know what's best for you.\"*\n- *\"You can tell how I feel.\"*\n- *\"She'd see the problem if she cared.\"* (The last one assumes mind-reading by presupposition.)\n\n**Quick check.** Does the sentence report something *observable* (*\"She frowned\"*, *\"He told me he was angry\"*) or an inner state of someone else (*\"He's angry at me\"*)? The second kind is mind-reading.\n\n**Two directions.**\n- **I read your mind:** acting on guesses about what you think and feel.\n- **You should read mine:** expecting others to know what the speaker has not said. This is a typical source of silence and resentment.\n\n**Questions.**\n- *How, specifically, do you know that?*\n- *What did you see or hear that told you?*\n- *What would they say if you asked?*\n\n**Authors' view.** They do not claim that knowing another person's state is impossible, only that it is *rarely* transmitted directly, and unexamined guesses are a major source of misunderstanding. So they treat mind-reading statements as ill-formed *until the process of knowing is explicit*.\n\n**Follow-up.** Whatever the speaker replies (\"He never looks at me\") is a new sentence to check with the other patterns, such as [[meta-model/generalization/universal-quantifiers]].\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Related:* [[meta-model/distortion/cause-and-effect]]", "links": ["meta-model/generalization/universal-quantifiers", "meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/cause-and-effect"]}, {"id": "meta-model/distortion/nominalization", "domain": "meta-model/distortion", "slug": "nominalization", "title": "Nominalization", "entry_type": "pattern", "tags": ["nominalization", "process-event", "distortion"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** A **nominalization** turns an ongoing action into a noun, so a process starts to look like a thing. Examples: *decide → decision, relate → relationship, fail → failure, communicate → communication, reject → rejection.*\n\n```svg\n<svg viewBox=\"0 0 640 240\" role=\"img\" aria-label=\"A flowing process becomes a fixed object when a verb is nominalized\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"160\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" fill=\"#3b82c4\" font-weight=\"600\">Process (verb)<\/text><text x=\"480\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" fill=\"#d9822b\" font-weight=\"600\">Event (noun)<\/text><path d=\"M20 70 C60 40, 100 100, 140 70 S 220 40, 300 70\" fill=\"none\" stroke=\"#3b82c4\" stroke-width=\"3\"/><line x1=\"300\" y1=\"70\" x2=\"300\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"160\" y=\"110\" text-anchor=\"middle\" font-size=\"13\">“we are deciding”<\/text><text x=\"160\" y=\"130\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">ongoing, can still change<\/text><line x1=\"310\" y1=\"70\" x2=\"360\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"335\" y=\"56\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">nominalize<\/text><rect x=\"395\" y=\"45\" width=\"170\" height=\"50\" rx=\"6\" fill=\"#d9822b\" fill-opacity=\".2\" stroke=\"#d9822b\" stroke-width=\"2\"/><text x=\"480\" y=\"76\" text-anchor=\"middle\" font-size=\"13\">“the decision”<\/text><text x=\"480\" y=\"115\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">a finished object<\/text><text x=\"480\" y=\"132\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">nothing left to do<\/text><rect x=\"60\" y=\"165\" width=\"520\" height=\"56\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"188.975\" text-anchor=\"middle\" font-size=\"13.5\">Test: does it fit “an ongoing ____”?<\/text><text x=\"320.0\" y=\"206.475\" text-anchor=\"middle\" font-size=\"13.5\">an ongoing decision ✓   an ongoing chair ✗<\/text><\/svg>\n```\n\n**Why it matters.** Things sit still; they cannot be reconsidered, steered or stopped. Once \"we are deciding\" becomes \"the decision\", the speaker has lost the sense of having a hand in it. The same shift converts \"someone is rejecting me\" into \"the rejection\", and that loses the person doing the rejecting.\n\n**How to spot one.**\n1. Look at each word that is not a verb.\n2. Ask: is there a verb that sounds and means almost the same? *(discourage → discouragement)*\n3. **Frame test:** can you say *\"an ongoing ____\"*? *an ongoing decision* works; *an ongoing chair* does not.\n4. **Wheelbarrow test:** can you picture the thing in a wheelbarrow? A chair, yes. A decision, no. Compare *\"I need water\"* with *\"I need respect\"*; *\"I lost my keys\"* with *\"I lost my confidence.\"*\n\n**Everyday cases.** *\"The tension in the team is huge\", \"Our communication is broken\", \"My anxiety got in the way\", \"Your disapproval hurt.\"*\n\n**What to do.** See [[meta-model/distortion/reversing-nominalizations]].\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Language side:* [[language/transformations]]", "links": ["meta-model/distortion/reversing-nominalizations", "meta-model/distortion/distortion-patterns-at-a-glance", "language/transformations"]}, {"id": "meta-model/distortion/presupposition-triggers", "domain": "meta-model/distortion", "slug": "presupposition-triggers", "title": "Presupposition triggers", "entry_type": "glossary", "tags": ["presupposition", "cue-words", "field-guide"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4 end, App. A–B, Glossary (pp. 106–108, 183–218)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A field guide to **English phrasings that carry presuppositions**. The list is adapted from the book's Appendix B, which draws on work by Lauri Karttunen and others. Examples here are new.\n\n**Simple (something exists).**\n| Trigger | Example | Presupposes |\n|---|---|---|\n| Names and pronouns | *Omar left early.* | someone called Omar exists |\n| Definite descriptions | *I liked the poster by the door.* | there is a poster by the door |\n| Quantifiers | *If some of the dragons come...* | there are dragons |\n\n**Complex (a fuller claim is assumed).**\n| Trigger | Example | Presupposes |\n|---|---|---|\n| Relative clauses | *The manager who hired Sam is leaving.* | a manager hired Sam |\n| Time clauses (*before, after, when, since, while*) | *After I quit smoking...* | I smoked |\n| Cleft *It was X that...* | *It was the delay that angered her.* | something angered her |\n| *What... is...* | *What bothers me is the tone.* | something bothers me |\n| Stress | *Did SHE write it?* | someone wrote it |\n| *New, old, former, previous* | *Her new job* | she had an old one |\n| Ordinals / *another* | *a third complaint* | two before it |\n| Comparatives, *as ... as* | *taller than Bo* | Bo is tall-ish; |\n| *Too, also, again, back, re-* | *She asked again.* | she asked before |\n| *Only, even, just, except* | *Even Ana came.* | Ana came; others were less likely |\n| Change verbs (*stop, start, continue, leave, become*) | *He stopped yelling.* | he was yelling |\n| Factives (*know, realize, regret, odd, aware*) | *It's odd that he called.* | he called |\n| Commentary (*luckily, happily, fortunately*) | *Luckily, you forgot it.* | you forgot it |\n| Counterfactual *if had* | *If you had listened...* | you didn't listen |\n| Questions | *Who took the file?* | someone took it |\n| Negative questions | *Didn't you want to come?* | I thought you did |\n| Rhetorical questions | *Who cares?* | nobody cares |\n\n**How to use the list.** When a sentence feels heavy, find which trigger it contains, state the presupposition, and decide whether to test it ([[meta-model/distortion/presuppositions-in-sentences]]).\n\n**Your own speech.** The same triggers carry *your* assumptions into questions. \"When did you stop procrastinating?\" presupposes the person did. Notice this before you ask.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Concept:* [[language/presupposition]]", "links": ["meta-model/distortion/presuppositions-in-sentences", "meta-model/distortion/distortion-patterns-at-a-glance", "language/presupposition"]}, {"id": "meta-model/distortion/presuppositions-in-sentences", "domain": "meta-model/distortion", "slug": "presuppositions-in-sentences", "title": "Presuppositions in sentences", "entry_type": "pattern", "tags": ["presupposition", "assumptions", "negation-test"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** The assumptions a speaker's sentence takes for granted. In the Meta-model they matter because they are the **basic organizing assumptions** of the speaker's model, and they rarely get examined.\n\n**Finding them (the negation test, adapted).**\n1. Take the main verb of the sentence: call the sentence A.\n2. Make B: the same sentence with *not* on that main verb.\n3. Ask what must be true for **both** A and B to make sense. Those statements are the presuppositions.\n\n**Example (new).** *\"I'm worried that my team will turn out as careless as the last one.\"*\nNegated: *\"I'm not worried that my team will turn out as careless as the last one.\"* Both need: **the last team was careless.** That never appears as a claim; it travels inside the worry.\n\n**Other triggers (spoken cues).** Many words load the clause that follows: *realize, notice, regret, know, be aware, ignore, forget*; and words like *since*, *if you knew*, *as ... as*, *another*, *stop*, *again*. These work regardless of topic, a point the authors expand in their Appendix B of syntactic environments.\n\n**Two ways to respond.**\n1. **Bring it up.** State the presupposition and ask about it: *\"The last team was careless: how, specifically?\"*\n2. **Set it aside and work the rest.** Accept the presupposition for now and apply the other questions to the original sentence.\n\n**Check yourself.** Presuppositions can be *yours*: when a question of yours includes one (\"Why do you hate meetings?\"), you have just installed an assumption.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Language side:* [[language/presupposition]]", "links": ["meta-model/distortion/distortion-patterns-at-a-glance", "language/presupposition"]}, {"id": "meta-model/distortion/reversing-nominalizations", "domain": "meta-model/distortion", "slug": "reversing-nominalizations", "title": "Reversing nominalizations", "entry_type": "technique", "tags": ["nominalization", "restoring-process", "questions"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Distortion (pp. 74–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Goal.** Turn the noun back into a verb, then ask for whoever and whatever the verb needs.\n\n**Step by step.**\n1. Find the nominalization (see [[meta-model/distortion/nominalization]]).\n2. Rewrite it as an ongoing action with a person doing it.\n3. Ask the deletion questions for that action ([[meta-model/deletion/unspecified-slots]]).\n\n**Worked examples (new).**\n\n| Said | Process version | Question that does both jobs |\n|---|---|---|\n| *My resentment is growing.* | I am resenting someone, more and more. | Who are you resenting, and for what? |\n| *Their disapproval hurts.* | They disapprove of something I do. | Who is disapproving of what? |\n| *The pressure is unbearable.* | Someone or something is pressuring me. | Who or what is pressuring you to do what? |\n| *Our miscommunication cost us.* | We misunderstood each other. | What did each of you take the other to mean? |\n\n**Direct challenges for the frozen thing.** When the noun is a \"decision\", \"plan\" or \"verdict\":\n- *Is there any way you could change that decision?*\n- *What stops you from reconsidering it?*\n- *What would happen if you decided differently?*\n\nAll three press the speaker to put themselves back into the process.\n\n**Practical advice from the authors.** Nominalizations rarely appear alone. Usually they come with deletions or other broken conditions. Ask for one piece at a time, as a chain of short questions, and avoid a single dense one.\n\n**Why people find this hard.** The authors report that nominalizations are the most difficult pattern to learn to hear in their trainings. Use the wheelbarrow test regularly until it becomes automatic.\n\n*Part of:* [[meta-model/distortion/distortion-patterns-at-a-glance]] · *Pair:* [[meta-model/distortion/nominalization]]", "links": ["meta-model/distortion/nominalization", "meta-model/deletion/unspecified-slots", "meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/nominalization"]}, {"id": "meta-model/generalization/challenging-a-generalization", "domain": "meta-model/generalization", "slug": "challenging-a-generalization", "title": "Challenging a generalization", "entry_type": "technique", "tags": ["counter-example", "imagination", "here-and-now"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Six ways to reconnect an absolute with experience. Use them singly or combined. Example claim throughout: **\"It's impossible to trust anyone.\"**\n\n| # | Move | Sounds like |\n|---|---|---|\n| 1 | **Exaggerate** the universal | *\"It's always impossible for anyone to trust anyone?\"* |\n| 2 | **Ask for a counter-experience** | *\"Have you ever trusted anyone?\"* |\n| 3 | **Ask them to imagine one** | *\"Can you imagine a situation where you could?\"* |\n| 4 | **Use the present** | *\"Do you trust me right now, in this conversation?\"* |\n| 5 | **Offer a common experience of your own** | *\"Have you ever taken a taxi or seen a doctor? Did you trust them?\"* |\n| 6 | **Ask what stops it / what would happen** | *\"What stops you from trusting anyone?\"*, *\"What would happen if you did?\"* |\n\n**Notes on specific moves.**\n- **#2** quietly shifts the referential index to *you*, tying the claim to the speaker's own life.\n- **#3** works when no real counter-example exists. After they imagine one, ask what differs between the fantasy and now.\n- **#4** is the strongest when the relationship is part of the claim. A \"yes\" disproves it; a \"no\" opens a specific, live question.\n- **#5** is for when the speaker cannot find one. Choose something so common they must have lived it.\n- **#6** is the same pair of questions as the modal-operator patterns ([[meta-model/deletion/modal-operators-of-possibility]]).\n\n**Spirit.** Each question is an invitation. Delivered as a challenge, the speaker will defend the claim and tighten it.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]] · *See also:* [[meta-model/generalization/universal-quantifiers]]", "links": ["meta-model/deletion/modal-operators-of-possibility", "meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/generalization/universal-quantifiers"]}, {"id": "meta-model/generalization/complex-equivalence", "domain": "meta-model/generalization", "slug": "complex-equivalence", "title": "Complex equivalence", "entry_type": "pattern", "tags": ["equivalence", "mind-reading", "shortcut"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** Two statements that sit side by side and, in the speaker's model, mean the same thing. Typically the speaker says one, pauses, and says the other in a similar form.\n\n> *\"He never replies to my messages.\"* … *\"He doesn't respect me.\"*\n\nOne is observable behaviour; the other is a **mind-reading** claim. The speaker has fused them: *\"never replies\" = \"doesn't respect.\"*\n\n**Shortcut technique (the book's six steps, in short).**\n1. Hear the two parallel statements.\n2. Ask directly whether they are equivalent: *\"Does his not replying always mean he doesn't respect you?\"*\n3. If the speaker says yes, **shift the indices**: *\"Does your not replying to him always mean you don't respect him?\"*\n4. Typically the speaker **denies** the equivalence for themself.\n5. Ask: **\"What's the difference?\"**\n6. Explore the gap: this shows the speaker has other explanations for silence in their own case, which can now apply to the other person.\n\n**Short exchange.**\n> A: My manager never praises me… she doesn't value me.\n> B: Does her not praising you always mean she doesn't value you?\n> A: Yes.\n> B: Does your not praising her always mean you don't value her?\n> A: No, that's different, I just don't think of it.\n> B: What's the difference?\n\n**Why it is fast.** One question from checking equivalence plus one swap often does what several rounds of probing would.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]] · *Uses:* [[meta-model/generalization/shifting-referential-indices]], [[meta-model/distortion/mind-reading]]", "links": ["meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/generalization/shifting-referential-indices", "meta-model/distortion/mind-reading"]}, {"id": "meta-model/generalization/generalization-patterns-at-a-glance", "domain": "meta-model/generalization", "slug": "generalization-patterns-at-a-glance", "title": "Generalization patterns at a glance", "entry_type": "framework", "tags": ["generalization", "overview", "index"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Idea.** Generalization lets one piece of experience stand for a whole category, losing the detail that would give a person more choices. A single hurt becomes \"people hurt you.\" The tools here put detail back.\n\n**The two linguistic checks the book offers:**\n1. Do the nouns and event words have **referential indices**? (Do they point to someone or something specific?)\n2. Are the **verbs fully specified**? (Can you picture what happened?)\n\n| Pattern | What it sounds like | Core question |\n|---|---|---|\n| [[meta-model/generalization/who-or-what-specifically]] | *\"People ignore me.\"* | Who, specifically? |\n| [[meta-model/generalization/universal-quantifiers]] | *\"Nobody ever helps.\"* | Never? Nobody? Any exception? |\n| [[meta-model/generalization/incompletely-specified-verbs]] | *\"She dismissed me.\"* | How, specifically? |\n| [[meta-model/generalization/complex-equivalence]] | *\"He's late. He doesn't care.\"* | Does late always mean not caring? |\n| [[meta-model/generalization/shifting-referential-indices]] | *\"My team never supports me.\"* | Do you support your team? |\n| [[meta-model/generalization/or-rules-to-if-then]] | *\"Say yes or they'll resent me.\"* | If you say no, they will? |\n\n**Modal operators.** Words like *must* and *can't* also announce generalizations (rules and limits). The book classes them under deletion because each hides a consequence or a cause: see [[meta-model/deletion/modal-operators-of-necessity]] and [[meta-model/deletion/modal-operators-of-possibility]]. Their companion in this family, the **lost performative**, is under [[meta-model/distortion/lost-performative]].\n\n**Goals of challenging a generalization.**\n1. Reconnect the model with the experience it came from.\n2. Shrink an overwhelming obstacle to something definite.\n3. Restore detail, so new distinctions (and options) appear.\n\n*Part of:* [[meta-model/the-meta-model]] · *Compare:* [[meta-model/deletion/deletion-patterns-at-a-glance]], [[meta-model/distortion/distortion-patterns-at-a-glance]]", "links": ["meta-model/generalization/who-or-what-specifically", "meta-model/generalization/universal-quantifiers", "meta-model/generalization/incompletely-specified-verbs", "meta-model/generalization/complex-equivalence", "meta-model/generalization/shifting-referential-indices", "meta-model/generalization/or-rules-to-if-then", "meta-model/deletion/modal-operators-of-necessity", "meta-model/deletion/modal-operators-of-possibility", "meta-model/distortion/lost-performative", "meta-model/the-meta-model", "meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/distortion/distortion-patterns-at-a-glance"]}, {"id": "meta-model/generalization/incompletely-specified-verbs", "domain": "meta-model/generalization", "slug": "incompletely-specified-verbs", "title": "Incompletely specified verbs", "entry_type": "pattern", "tags": ["verbs", "specificity", "how-specifically"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Observation.** Every verb is vague to some degree. The picture it gives depends on:\n\n1. **The verb itself.** *Kiss* is more precise than *touch*; *shout* than *speak*; *hurt* is very loose.\n2. **The words around it.** **Hurt by rejecting* is more specific than *hurt*.\n\n| Statement | How clear is the picture? |\n|---|---|\n| *Lucas supported me.* | vague: any of a hundred actions |\n| *Lucas covered my shift.* | clearer |\n| *Lucas stayed until 11 to help me finish the slides.* | fully visualizable |\n\n**Test.** After a verb, ask yourself: *can I see what actually happened?* If not, the verb is incompletely specified.\n\n**Question.** **\"How, specifically, did X [verb phrase]?\"**\n\n- *\"My team undermines me.\"* → *How, specifically, does your team undermine you?*\n- *\"She always shows she cares.\"* → *How, specifically, does she show it?*\n- *\"They are trying to push me out.\"* → *How, specifically, are they trying to push you out?*\n\nThe question is an invitation to describe, so it also works well in plain curiosity: *\"What did that look like?\"*\n\n**Why this matters.** Because every verb is vague, **every sentence is an opportunity** to check whether the picture is clear. Do it often enough and you reliably stand on the speaker's actual experience, not on your guess.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]] · *Related:* [[meta-model/distortion/cause-and-effect]], [[meta-model/the-meta-model]]", "links": ["meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/distortion/cause-and-effect", "meta-model/the-meta-model"]}, {"id": "meta-model/generalization/or-rules-to-if-then", "domain": "meta-model/generalization", "slug": "or-rules-to-if-then", "title": "Or-rules to if-then", "entry_type": "technique", "tags": ["rules", "logic", "reversal", "consequences"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The pattern.** A rule stated as **X or Y**: *\"I have to say yes to every request, or people will be upset.\"*\n\n**Convert it.** In logic, *X or Y* is equivalent to *If not X, then Y.* So:\n\n> **If I don't say yes, people will be upset.**\n\nThe \"or Y\" is often supplied only after asking *\"Or what will happen?\"* ([[meta-model/deletion/modal-operators-of-necessity]]).\n\n**Challenge it.** Once the speaker agrees to the if-then form, **reverse it with negatives** and offer it back:\n\n> **If you do say yes, people won't be upset?**\n\nThen add absolutes if useful:\n\n> **If you do say yes, will they *always* be happy?**\n\n**What this shows.** The speaker believes in a **fixed link** between what they do and how others react. Testing both directions exposes whether the link really holds, and where it doesn't.\n\n**Care.** Offer the reversal as a genuine question, since it can sound clever or sarcastic.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]] · *Uses:* [[meta-model/deletion/modal-operators-of-necessity]]", "links": ["meta-model/deletion/modal-operators-of-necessity", "meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/deletion/modal-operators-of-necessity"]}, {"id": "meta-model/generalization/shifting-referential-indices", "domain": "meta-model/generalization", "slug": "shifting-referential-indices", "title": "Shifting referential indices", "entry_type": "technique", "tags": ["projection", "symmetry", "perspective-swap"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**When to use it.** The speaker makes a generalization about **another person** where the speaker is cast as the passive receiver: *\"My team never supports me\", \"Dad always criticizes me.\"* Their own part in the relationship has dropped out of the picture.\n\n```svg\n<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"Referential index shift swaps the subject and object of a statement\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"30\" y=\"20\" width=\"250\" height=\"50\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"155.0\" y=\"49.55\" text-anchor=\"middle\" font-size=\"13\">“My manager never listens to me.”<\/text><rect x=\"360\" y=\"20\" width=\"250\" height=\"50\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"485.0\" y=\"49.55\" text-anchor=\"middle\" font-size=\"13\">“I never listen to my manager.”<\/text><line x1=\"280\" y1=\"35\" x2=\"360\" y2=\"35\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"360\" y1=\"55\" x2=\"280\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"320\" y=\"92\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">swap who is doing and who is receiving<\/text><rect x=\"30\" y=\"120\" width=\"580\" height=\"60\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"146.05\" text-anchor=\"middle\" font-size=\"13\">Then ask: is this also true? When is it not?<\/text><text x=\"320.0\" y=\"163.05\" text-anchor=\"middle\" font-size=\"13\">The answer compares two situations and re-opens the speaker's own part.<\/text><\/svg>\n```\n\n**The move.** Swap the two people and ask the speaker to check the result.\n\n| Said | Swapped | Ask |\n|---|---|---|\n| *My team never supports me.* | I never support my team. | Is that true? |\n| *Dad always criticizes me.* | I always criticize Dad. | Do you? |\n\n**Two kinds of predicate.**\n- **Symmetrical:** if X does it with Y then Y does it with X. *Argue with, meet, work with, compete with.* The swap is **necessarily true**: it takes two to argue. So the technique simply restores a hidden half of the picture.\n- **Non-symmetrical:** *smile at, criticize, listen to, ignore.* The swap is **not logically implied**; it may or may not be true.\n\n**The authors' observation.** In their clinical experience, when the relationship matters to the speaker, the swapped version is often *psychologically* true. They link this to what other schools call **projection**. Treat that as their clinical impression, not a tested law.\n\n**Use gently.** Either way the answer is useful. If true, the speaker sees their side. If false, the contrast shows what is different about the person they described.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "meta-model/generalization/universal-quantifiers", "domain": "meta-model/generalization", "slug": "universal-quantifiers", "title": "Universal quantifiers", "entry_type": "pattern", "tags": ["all", "never", "always", "exceptions", "generalization"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Cue words.** *all, every, each, any, always, never, none, nobody, no one, nothing, nowhere, everyone, everything.*\n\nThey have no referential index and mark a claim with **no exceptions**.\n\n**Standard challenge: exaggerate and ask for exceptions.** Repeat the claim with the quantifier stretched, in a curious tone:\n\n> *\"Nobody ever listens to me.\"*\n> → *\"Nobody, ever, at all?\"* (emphasise the universal words)\n\nThe speaker usually answers \"well, not exactly\", and the first exception opens the door: *\"Who, specifically, doesn't listen?\"*\n\n**Other ways to challenge.** Use any of the moves in [[meta-model/generalization/challenging-a-generalization]]: ask for a counter-experience, ask them to imagine one, look at the present moment, etc.\n\n**Example (new).** *\"Everyone at the conference ignored me.\"* → *\"Everyone? Even the person who handed you the badge?\"* (Hold the humour lightly; it must not mock.)\n\n**Why a single exception matters.** The point is not to win. One exception starts the speaker assigning names and cases, which restores detail.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["meta-model/generalization/challenging-a-generalization", "meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "meta-model/generalization/who-or-what-specifically", "domain": "meta-model/generalization", "slug": "who-or-what-specifically", "title": "Who or what, specifically", "entry_type": "technique", "tags": ["referential-index", "specificity", "generalization"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Generalization (pp. 80–107)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What to listen for.** Nouns and noun phrases that fail to pick out a specific person or thing:\n\n| No index | Has an index |\n|---|---|\n| *People, nobody, everyone, someone* | *Priya, my sister, the finance team, Monday's meeting* |\n| *Things, situations, it, that way* | *the Henderson contract, the argument on Friday* |\n| *\"Dogs that are friendly\"* | *Biscuit, the neighbour's spaniel* |\n| *One, you (as in \"you never know\")* | *I, you (this person)* |\n\nEach is a **generalization marker** that keeps the speaker's model blurry. (See [[language/referential-index]].)\n\n**Two questions are enough.**\n- **\"Who, specifically?\"**\n- **\"What, specifically?\"**\n\nUse variants as needed: *Which person? Which situation? What exactly happened?* Repeat until a name or concrete case appears.\n\n**Example chain (new).**\n> *\"People don't respect my time.\"* → Who, specifically? → *\"Clients.\"* → Which clients? → *\"The Larsson account.\"* → What, specifically, do they do? → *\"They book calls and reschedule them.\"*\n\nFour short questions replaced a global complaint with a case you can work on. Notice that each answer is itself a sentence to listen to.\n\n**Don't over-apply.** Everyday talk uses indefinites naturally (\"someone left a note\"). Probe where the vagueness hides something painful or sits in an area where the speaker feels stuck.\n\n*Part of:* [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["language/referential-index", "meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "perception/behavior-makes-sense-inside-the-model", "domain": "perception", "slug": "behavior-makes-sense-inside-the-model", "title": "Behavior makes sense inside the model", "entry_type": "concept", "tags": ["charity", "empathy", "model"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A working rule the authors repeat: **any behaviour, however odd it looks, is the sensible output of the model that produced it.**\n\nSeeing it this way changes what you do next:\n\n- Instead of \"why would anyone do that?\" you ask \"*what would the world have to look like for that to be the best move?*\"\n- Instead of judging the choice, you look for the missing choices.\n- Understanding a person means building a picture of their model. Nothing in the picture needs your agreement.\n\nThe authors credit this stance to thinkers like Bateson and Laing, and note Sherlock Holmes working the same way: take the behaviour as data, and infer the world that makes it reasonable.\n\n**Limits.** This is a stance for understanding, not a claim that every behaviour is acceptable or harmless. It tells you where to look for change; it does not excuse harm.\n\n**Short script.** \"Given that you see it that way, what makes the other options not worth taking?\" This keeps you inside their map while inviting them to describe it.\n\n*Related:* [[perception/impoverished-models-and-few-choices]], [[perception/map-and-territory]]", "links": ["perception/impoverished-models-and-few-choices", "perception/map-and-territory"]}, {"id": "perception/expectation-shapes-what-you-see", "domain": "perception", "slug": "expectation-shapes-what-you-see", "title": "Expectation shapes what you see", "entry_type": "concept", "tags": ["expectation", "set", "perception-experiment"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The experiment.** Psychologists Bruner and Postman flashed playing cards at people for brief moments. Some cards were wrong in a way nobody expected, such as a *red* six of spades. Findings, in plain terms:\n\n- People named the odd cards quickly and confidently as ordinary ones (a six of spades or a six of hearts). They did not report anything strange.\n- With longer exposure, they began to hesitate: \"that's a spade, but something is off with it.\"\n- Most then broke through to the right answer. A few never did, even at forty times the normal exposure, and some were visibly upset.\n\n**What the authors take from it.** The subjects had a generalization (spades are black, hearts are red) and **bent the sensory data to keep it**. Seeing is not passive copying; it fits input into the categories already prepared.\n\n**Why this belongs here.** It is a small, clean lab version of the same machinery that shapes everyday life, from how someone hears a partner to how a scientist handles an anomaly. In both, novelty gets in only slowly, \"manifested by resistance against a background provided by expectation.\"\n\n**A usable habit.** When something is odd and you are quick to explain it away, pause. Ask: *what rule am I protecting?* The pause is what moves you from the first, confident reading toward the hesitant one that can learn.\n\n*Related:* [[perception/self-confirming-loops]], [[perception/generalization-deletion-and-distortion]]", "links": ["perception/self-confirming-loops", "perception/generalization-deletion-and-distortion"]}, {"id": "perception/generalization-deletion-and-distortion", "domain": "perception", "slug": "generalization-deletion-and-distortion", "title": "Generalization, deletion and distortion", "entry_type": "framework", "tags": ["modeling-processes", "foundation"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Three processes build every model, and each one is both a **strength and a hazard**. The book calls them the universals of human modeling.\n\n```svg\n<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Three modeling processes: generalization, deletion, distortion\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"190\" height=\"190\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"115.0\" y=\"119.9\" text-anchor=\"middle\" font-size=\"14\"><\/text><rect x=\"225\" y=\"20\" width=\"190\" height=\"190\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"119.9\" text-anchor=\"middle\" font-size=\"14\"><\/text><rect x=\"430\" y=\"20\" width=\"190\" height=\"190\" rx=\"9\" fill=\"#3aa17e\" fill-opacity=\".14\" stroke=\"#3aa17e\" stroke-width=\"1.6\"/><text x=\"525.0\" y=\"119.9\" text-anchor=\"middle\" font-size=\"14\"><\/text><text x=\"115\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" fill=\"#3b82c4\" font-weight=\"600\">Generalization<\/text><text x=\"320\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" fill=\"#d9822b\" font-weight=\"600\">Deletion<\/text><text x=\"525\" y=\"48\" text-anchor=\"middle\" font-size=\"15\" fill=\"#3aa17e\" font-weight=\"600\">Distortion<\/text><circle cx=\"55\" cy=\"100\" r=\"5\" fill=\"#3b82c4\"/><circle cx=\"75\" cy=\"120\" r=\"5\" fill=\"#3b82c4\"/><circle cx=\"60\" cy=\"140\" r=\"5\" fill=\"#3b82c4\"/><circle cx=\"90\" cy=\"105\" r=\"5\" fill=\"#3b82c4\"/><circle cx=\"80\" cy=\"145\" r=\"5\" fill=\"#3b82c4\"/><line x1=\"105\" y1=\"122\" x2=\"135\" y2=\"122\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><circle cx=\"170\" cy=\"122\" r=\"26\" fill=\"#3b82c4\" fill-opacity=\".25\" stroke=\"#3b82c4\" stroke-width=\"2\"/><text x=\"115\" y=\"185\" text-anchor=\"middle\" font-size=\"12.5\">one case becomes a rule<\/text><circle cx=\"255\" cy=\"110\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"295\" cy=\"110\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"375\" cy=\"110\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"255\" cy=\"140\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"335\" cy=\"140\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"375\" cy=\"140\" r=\"6\" fill=\"#d9822b\"/><circle cx=\"335\" cy=\"110\" r=\"6\" fill=\"none\" stroke=\"#d9822b\" stroke-dasharray=\"3 3\"/><circle cx=\"295\" cy=\"140\" r=\"6\" fill=\"none\" stroke=\"#d9822b\" stroke-dasharray=\"3 3\"/><text x=\"320\" y=\"185\" text-anchor=\"middle\" font-size=\"12.5\">parts drop out of view<\/text><rect x=\"460\" y=\"95\" width=\"42\" height=\"42\" fill=\"#3aa17e\" fill-opacity=\".25\" stroke=\"#3aa17e\" stroke-width=\"2\"/><line x1=\"512\" y1=\"116\" x2=\"540\" y2=\"116\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><polygon points=\"552,137 560,95 604,95 596,137\" fill=\"#3aa17e\" fill-opacity=\".25\" stroke=\"#3aa17e\" stroke-width=\"2\"/><text x=\"525\" y=\"185\" text-anchor=\"middle\" font-size=\"12.5\">shape is bent or relabelled<\/text><\/svg>\n```\n\n| Process | What it does | Useful when | Harmful when |\n|---|---|---|---|\n| **Generalization** | A piece of one experience detaches and stands for a whole category. | A burn teaches you to respect hot stoves. | It becomes \"stoves are dangerous\" and you avoid kitchens. |\n| **Deletion** | You attend to some parts of experience and exclude others. | Following one voice in a crowded room. | You cannot hear kindness from someone because it conflicts with your self-image. |\n| **Distortion** | You shift how sensory data is represented. | Rehearsing a speech, imagining, making art. | You reinterpret praise as manipulation. |\n\n**Worked intuition on generalization.** A child who falls off a rocking chair may decide \"chairs are unstable\". Another child who separates rocking chairs from other chairs keeps a more useful rule, \"rocking chairs: don't lean back.\" The second has a richer model and more choices. The point: *there are no right generalizations, only ones that fit or fail a context.* \"Don't show feelings\" may protect someone in a harsh institution and isolate them in a marriage.\n\n**Footnote worth keeping.** The authors admit the three-way split is a convenience, and that generalization and deletion can both be viewed as special kinds of distortion. They claim usefulness, not truth.\n\n**How the rest of the hub uses this.** Each process has a matching set of language patterns and a matching family of questions:\n- [[meta-model/deletion/deletion-patterns-at-a-glance]] patterns (what is missing)\n- [[meta-model/generalization/generalization-patterns-at-a-glance]] patterns (what has become a rule)\n- [[meta-model/distortion/distortion-patterns-at-a-glance]] patterns (what has been twisted)\n\n*Related:* [[perception/self-confirming-loops]], [[perception/expectation-shapes-what-you-see]]", "links": ["meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/distortion/distortion-patterns-at-a-glance", "perception/self-confirming-loops", "perception/expectation-shapes-what-you-see"]}, {"id": "perception/impoverished-models-and-few-choices", "domain": "perception", "slug": "impoverished-models-and-few-choices", "title": "Impoverished models and few choices", "entry_type": "concept", "tags": ["choice", "pain", "model-richness"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The observation.** People in distress usually feel they have few or no options, and none of the options attract them. Others, facing the same life event, see many options and treat the same change as a time of energy.\n\n**The authors' explanation.** The difference lies in how *rich* the person's model of the situation is, not in how rich the world is. The world offers plenty; the model leaves most of it out.\n\n**Two attitudes that follow:**\n\n1. **Nobody is \"bad, crazy or sick\" for acting as they do.** Each person is picking the best option *available inside their model*. Their behaviour looks strange from outside because we can see choices their map does not show them.\n2. **The trouble is not wrong choices, but too few.** So the aim of helping is to add options to the map, never to argue the person out of their best-available choice.\n\n**The paradox the authors flag.** The same capacity that lets people grow, create and survive (manipulating symbols, making models) is what lets them keep a cramped model. Models are necessary, and mistaking the model for the world is the danger.\n\n**A new everyday case.** A colleague says \"there's no way to get this approved.\" It is easy to answer with a list of routes. Typically that fails, because the routes are in the part of the map the colleague has already blanked. [[meta-model/don-t-advise-into-the-gap]] explains why and what to do instead.\n\n*Leads to:* [[perception/generalization-deletion-and-distortion]]", "links": ["meta-model/don-t-advise-into-the-gap", "perception/generalization-deletion-and-distortion"]}, {"id": "perception/individual-filters", "domain": "perception", "slug": "individual-filters", "title": "Individual filters", "entry_type": "concept", "tags": ["filters", "personal-history", "uniqueness"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The third family is the most personal: the models you build from your own life. No two histories are identical, so no two models are, even when two people share a community and a language.\n\nThe book's limiting case is **identical twins** raised in the same house. One might summarise childhood as \"our parents argued constantly and my sibling was the favourite\"; the other as \"our parents debated everything and clearly adored us both.\" Same events, different maps.\n\nThese personal differences produce each person's interests, habits, dislikes and rules for behaviour. Crucially, they can go two ways:\n\n| Direction | What happens |\n|---|---|\n| **Enriching** | The personal model adds options beyond the socially given ones (an artist's way of seeing, a scientist's new category). |\n| **Impoverishing** | The personal model shrinks the options, and the person feels stuck. |\n\nThe rest of the book is about spotting the second kind and widening it. The tools for that are the [[perception/generalization-deletion-and-distortion]] processes and the [[meta-model/the-meta-model]].\n\n**Practical reminder.** Because individual filters are where people differ most, never assume your reading of an event is the one the other person had. Ask for theirs.\n\n*Part of:* [[perception/map-and-territory]] · *Compare:* [[perception/social-filters]]", "links": ["perception/generalization-deletion-and-distortion", "meta-model/the-meta-model", "perception/map-and-territory", "perception/social-filters"]}, {"id": "perception/map-and-territory", "domain": "perception", "slug": "map-and-territory", "title": "Map and territory", "entry_type": "framework", "tags": ["map-territory", "modeling", "foundation"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The core claim.** Nobody acts directly on the world. Each person builds a representation of it, a *map* or *model*, and acts from that. The map determines what you notice, what feels possible, and which choices you can see. The world itself (the *territory*) always has more in it than any map.\n\nTwo consequences matter throughout this hub:\n\n1. **Every model differs from the world**, necessarily. A map that matched the territory point for point would be the territory. Its usefulness comes from being a reduced picture with a similar structure.\n2. **Every person's model differs from every other person's**, because each of us builds ours from different experience.\n\nA useful way to hold it: when two people disagree, they are often both reporting their maps accurately. The argument is about maps, and the territory has not changed.\n\n**Where the differences come from.** Three families of filters sit between the territory and the map: [[perception/neurological-filters]], [[perception/social-filters]] and [[perception/individual-filters]].\n\n```svg\n<svg viewBox=\"0 0 640 440\" role=\"img\" aria-label=\"The world passes through three sets of filters to become a personal model\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"170\" y=\"10\" width=\"300\" height=\"50\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"30.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">The world<\/text><text x=\"320.0\" y=\"48.9\" text-anchor=\"middle\" font-size=\"14\">the territory<\/text><line x1=\"320\" y1=\"60\" x2=\"320\" y2=\"88\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"170\" y=\"90\" width=\"300\" height=\"62\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"116.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Neurological filters<\/text><text x=\"320.0\" y=\"134.9\" text-anchor=\"middle\" font-size=\"14\">what the senses can pick up<\/text><text x=\"560\" y=\"118\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3b82c4\">same for every human<\/text><line x1=\"320\" y1=\"152\" x2=\"320\" y2=\"180\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"170\" y=\"182\" width=\"300\" height=\"62\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"208.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Social filters<\/text><text x=\"320.0\" y=\"226.9\" text-anchor=\"middle\" font-size=\"14\">language, categories, shared fictions<\/text><text x=\"560\" y=\"210\" text-anchor=\"middle\" font-size=\"12\" fill=\"#d9822b\">same for one community<\/text><line x1=\"320\" y1=\"244\" x2=\"320\" y2=\"272\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"170\" y=\"274\" width=\"300\" height=\"62\" rx=\"9\" fill=\"#3aa17e\" fill-opacity=\".14\" stroke=\"#3aa17e\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"300.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Individual filters<\/text><text x=\"320.0\" y=\"318.9\" text-anchor=\"middle\" font-size=\"14\">personal history and habits<\/text><text x=\"560\" y=\"302\" text-anchor=\"middle\" font-size=\"12\" fill=\"#3aa17e\">unique to you<\/text><line x1=\"320\" y1=\"336\" x2=\"320\" y2=\"364\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"170\" y=\"366\" width=\"300\" height=\"56\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"389.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Your model of the world<\/text><text x=\"320.0\" y=\"407.9\" text-anchor=\"middle\" font-size=\"14\">the map you act from<\/text><\/svg>\n```\n\n**Why it matters for communication.** Words are made from the map, not from the world. So what someone says is a description of their model, and any reply is addressed to that model. The patterns in [[meta-model/the-meta-model]] are ways of listening *through* the words to the model behind them, and of widening that model when it is too small to be comfortable.\n\n**Source idea.** The map/territory distinction is Alfred Korzybski's; the authors also lean on Hans Vaihinger's *as if* philosophy, which treats our concepts as working instruments, not portraits of reality.\n\n*Related:* [[perception/impoverished-models-and-few-choices]], [[perception/generalization-deletion-and-distortion]]", "links": ["perception/neurological-filters", "perception/social-filters", "perception/individual-filters", "meta-model/the-meta-model", "perception/impoverished-models-and-few-choices", "perception/generalization-deletion-and-distortion"]}, {"id": "perception/neurological-filters", "domain": "perception", "slug": "neurological-filters", "title": "Neurological filters", "entry_type": "concept", "tags": ["filters", "senses", "perception"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The first and most universal filter is the body. Each sense detects only a slice of what physically exists, and the nervous system adds its own distortions inside that slice.\n\n- **Range limits.** People hear roughly 20 Hz to 20,000 Hz, and see only a narrow band of light wavelengths. Sound and light outside those bands are the same kind of physical event, yet they simply do not register. We build instruments (microphones for ultrasound, infrared cameras) to translate them into signals we *can* sense.\n- **Resolution varies across the body.** Two touches a few millimetres apart on a fingertip feel like two touches. The same pair on the upper back feel like one. Same world, different experience, caused entirely by the nervous system. (This is the old two-point threshold result.)\n\n**What it teaches.** Even before language or culture arrives, the map is already a reduced and slightly bent copy. Because every human shares these limits, this layer is the *common ground* of experience; differences between people begin at the next layer, [[perception/social-filters]].\n\n**Not fixed.** The authors note that these constraints can be challenged. Biofeedback research showed people gaining voluntary influence over processes once thought automatic, such as brain-wave rhythm.\n\n**Try it.** Next time you notice only the sound of one voice in a noisy room, notice that you have just performed a filtering act your ears and attention agreed on. Then ask what else is being filtered out right now.\n\n*Part of:* [[perception/map-and-territory]]", "links": ["perception/social-filters", "perception/map-and-territory"]}, {"id": "perception/self-confirming-loops", "domain": "perception", "slug": "self-confirming-loops", "title": "Self-confirming loops", "entry_type": "pattern", "tags": ["feedback-loop", "self-fulfilling", "beliefs"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "When generalization, deletion and distortion work together they form a loop that protects the model from contradiction.\n\n```svg\n<svg viewBox=\"0 0 640 300\" role=\"img\" aria-label=\"A self-confirming loop of belief, filtering and experience\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"30\" y=\"20\" width=\"230\" height=\"60\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"145.0\" y=\"45.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Belief<\/text><text x=\"145.0\" y=\"63.9\" text-anchor=\"middle\" font-size=\"14\">“I don't matter to people”<\/text><rect x=\"380\" y=\"20\" width=\"230\" height=\"60\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"495.0\" y=\"45.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Filter<\/text><text x=\"495.0\" y=\"63.9\" text-anchor=\"middle\" font-size=\"14\">notice less, reinterpret more<\/text><rect x=\"380\" y=\"200\" width=\"230\" height=\"60\" rx=\"9\" fill=\"#3aa17e\" fill-opacity=\".14\" stroke=\"#3aa17e\" stroke-width=\"1.6\"/><text x=\"495.0\" y=\"225.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Experience<\/text><text x=\"495.0\" y=\"243.9\" text-anchor=\"middle\" font-size=\"14\">looks like confirmation<\/text><rect x=\"30\" y=\"200\" width=\"230\" height=\"60\" rx=\"9\" fill=\"#a15fc2\" fill-opacity=\".14\" stroke=\"#a15fc2\" stroke-width=\"1.6\"/><text x=\"145.0\" y=\"225.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Stronger belief<\/text><text x=\"145.0\" y=\"243.9\" text-anchor=\"middle\" font-size=\"14\">so the filter tightens<\/text><line x1=\"260\" y1=\"50\" x2=\"380\" y2=\"50\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"495\" y1=\"80\" x2=\"495\" y2=\"200\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"380\" y1=\"230\" x2=\"260\" y2=\"230\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"145\" y1=\"200\" x2=\"145\" y2=\"80\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"320\" y=\"160\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">loop<\/text><\/svg>\n```\n\n**The book's example (retold with new details).** A man believes he is not worth caring about. His partner repeatedly says warm things. In the moment, he *deletes* some of them (he does not hear them), and when one is pointed out he *distorts* it (\"she only says that because she wants something\"). His experience therefore contains no evidence against the belief. The belief survives and the filter tightens.\n\n**A fresh example.** A new employee decides \"senior people don't take juniors seriously\". In meetings, she notices the times she is interrupted and skips the times her points are taken up. A senior asks for her view and she reads it as politeness. After a few weeks her evidence file is full, and so is her expectation.\n\n**Why it matters.** The loop is *self-sealing*: more experience does not correct it, because experience is filtered before it arrives. It is the mechanism behind many self-fulfilling prophecies (the authors cite forward feedback).\n\n**Breaking the loop.** Inside the loop, arguing facts fails. What helps is a move that gets the person to attend to the filtered-out material on their own terms. The question patterns in the Meta-model do this by asking for the specifics the filter removed.\n\n*Related:* [[perception/generalization-deletion-and-distortion]], [[perception/expectation-shapes-what-you-see]]", "links": ["perception/generalization-deletion-and-distortion", "perception/expectation-shapes-what-you-see"]}, {"id": "perception/social-filters", "domain": "perception", "slug": "social-filters", "title": "Social filters", "entry_type": "concept", "tags": ["filters", "language", "culture", "whorf"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 1 (pp. 5–20)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The second family of filters comes from belonging to a group. The authors call it *social genetics*: all the categories, habits of perceiving, and agreed fictions you inherit as a member of a community. **Language is the most visible one.**\n\n**How language filters.** The number of distinctions your vocabulary makes in an area becomes the number of distinctions you habitually *notice*.\n\n```svg\n<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"A range of blues treated as one category versus two\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"320\" y=\"22\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">One stretch of experience, cut two ways<\/text><defs><linearGradient id=\"bl\" x1=\"0\" x2=\"1\"><stop offset=\"0\" stop-color=\"#bfe0ff\"/><stop offset=\"1\" stop-color=\"#0b2c6b\"/><\/linearGradient><\/defs><rect x=\"40\" y=\"40\" width=\"560\" height=\"40\" rx=\"6\" fill=\"url(#bl)\"/><text x=\"320\" y=\"70\" text-anchor=\"middle\" font-size=\"12\" fill=\"#ffffff\">a continuous range of blues<\/text><line x1=\"40\" y1=\"100\" x2=\"600\" y2=\"100\" stroke=\"#3b82c4\" stroke-width=\"3\"/><line x1=\"40\" y1=\"94\" x2=\"40\" y2=\"106\" stroke=\"#3b82c4\" stroke-width=\"3\"/><line x1=\"600\" y1=\"94\" x2=\"600\" y2=\"106\" stroke=\"#3b82c4\" stroke-width=\"3\"/><text x=\"320\" y=\"124\" text-anchor=\"middle\" font-size=\"13\">Speaker A's vocabulary: one word, <tspan font-weight='600'>blue<\/tspan><\/text><line x1=\"40\" y1=\"152\" x2=\"318\" y2=\"152\" stroke=\"#d9822b\" stroke-width=\"3\"/><line x1=\"322\" y1=\"152\" x2=\"600\" y2=\"152\" stroke=\"#a15fc2\" stroke-width=\"3\"/><line x1=\"40\" y1=\"146\" x2=\"40\" y2=\"158\" stroke=\"#d9822b\" stroke-width=\"3\"/><line x1=\"318\" y1=\"146\" x2=\"318\" y2=\"158\" stroke=\"#d9822b\" stroke-width=\"3\"/><line x1=\"322\" y1=\"146\" x2=\"322\" y2=\"158\" stroke=\"#a15fc2\" stroke-width=\"3\"/><line x1=\"600\" y1=\"146\" x2=\"600\" y2=\"158\" stroke=\"#a15fc2\" stroke-width=\"3\"/><text x=\"179\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9822b\" font-weight=\"600\">light blue<\/text><text x=\"461\" y=\"176\" text-anchor=\"middle\" font-size=\"13\" fill=\"#a15fc2\" font-weight=\"600\">dark blue<\/text><text x=\"320\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">Speaker B's vocabulary: two words, so two habitual categories<\/text><\/svg>\n```\n\nSpeakers whose language has a single word for a range of experience tend to treat items inside that range as \"the same\", while speakers with two words tend to see two. (In the book's own case a language with only a few basic colour words groups sensations that English separates.) Russian, which has separate basic words for light and dark blue, is a commonly cited modern example. The physical stimulus is identical; the habitual sorting differs.\n\n**Subtler: grammar hides a choice.** \"The book is blue\" sounds like blue belongs to the book. But *blue* is the name we gave to our sensation. The grammar of subject and attribute pushes us to treat a response as a property of the thing. The same grammar lets us say \"the meeting was boring\" as though boredom lived in the meeting.\n\n**Good news.** Social filters are easier to loosen than neurological ones. The proof is that people can learn a second language, and bilingual people often report feeling slightly different in each one.\n\n**Use.** When someone's description feels stuck, ask what categories their vocabulary gives them for the situation. Adding a distinction (a new word, a new contrast) can add a choice.\n\n*Part of:* [[perception/map-and-territory]] · *Compare:* [[perception/individual-filters]]", "links": ["perception/map-and-territory", "perception/individual-filters"]}, {"id": "practice/choosing-a-thread-in-a-conversation", "domain": "practice", "slug": "choosing-a-thread-in-a-conversation", "title": "Choosing a thread in a conversation", "entry_type": "framework", "tags": ["strategy", "transcripts", "practice", "follow-up"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The book's two long transcripts are not reproduced here. Their commentary teaches a handful of lessons about **how the questions work in a real conversation**.\n\n**1. One sentence breaks many conditions at once.** A line like *\"I'm not sure this will be helpful\"* may contain a deletion (helpful to whom?), a vague verb (helpful how?), an unspecific noun (this?), a nominalization and an implied causative. The listener picks one thread; the others can wait.\n\n**2. Each reply is new material.** The answer to your questi
