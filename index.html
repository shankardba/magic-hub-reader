on is another sentence with its own gaps. You do not need to chase every gap. Choose the one that matters most to the area of limited choice.\n\n**3. Combine questions carefully.** The book shows dense questions that unpack a nominalization and ask for deletions together (*\"Who is deciding to return home?\"*). The authors say in practice to ask for one piece at a time.\n\n**4. Let some things stand.** The sessions deliberately leave some violations alone. Pick the stand-out limit (a *can't*, a *must*, a cause-effect) and follow it.\n\n**5. Check mind-reading and projection early.** When someone claims to know others' minds, shifting the referential indices ([[meta-model/generalization/shifting-referential-indices]]) tends to produce results.\n\n**6. Combine with other methods.** The Meta-model is meant to be integrated with other approaches. At a good moment in the book's second transcript the therapist leaves the questioning and moves into a different technique to let the client integrate and test the new learning.\n\n**7. The steps become automatic.** The authors say learners go through an artificial phase of consciously stepping through the checks. Then it drops out of awareness, and the behaviour remains systematic.\n\n**A caution the authors give.** The transcripts restrict the therapist to Meta-model questions *only to show the model*. They explicitly say that this is not how they work or recommend working, and not a picture of powerful therapy.\n\n*Related:* [[practice/practice-routine]], [[meta-model/the-meta-model]]", "links": ["meta-model/generalization/shifting-referential-indices", "practice/practice-routine", "meta-model/the-meta-model"]}, {"id": "practice/congruity-and-incongruity", "domain": "practice", "slug": "congruity-and-incongruity", "title": "Congruity and incongruity", "entry_type": "concept", "tags": ["congruity", "double-message", "analogical", "alignment"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Definition.** When two channels express different parts of someone's experience at once, the messages are either:\n- **Congruent:** they fit. Words, voice and body say the same thing.\n- **Incongruent:** they don't. A classic: sitting calmly, speaking quietly, saying *\"I am furious.\"*\n\n```svg\n<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Incongruity between verbal and non-verbal channels\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"270\" height=\"60\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"155.0\" y=\"46.05\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Words say<\/text><text x=\"155.0\" y=\"63.05\" text-anchor=\"middle\" font-size=\"13\">“I'm completely fine with it.”<\/text><rect x=\"350\" y=\"20\" width=\"270\" height=\"60\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"485.0\" y=\"46.05\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Voice and body show<\/text><text x=\"485.0\" y=\"63.05\" text-anchor=\"middle\" font-size=\"13\">tight jaw, clipped tone<\/text><text x=\"320\" y=\"56\" text-anchor=\"middle\" font-size=\"26\" font-weight=\"600\">≠<\/text><text x=\"320\" y=\"120\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Two channels carrying two different messages = incongruity<\/text><rect x=\"60\" y=\"140\" width=\"520\" height=\"70\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"320.0\" y=\"162.875\" text-anchor=\"middle\" font-size=\"12.5\">Move: bring both into one channel.<\/text><text x=\"320.0\" y=\"179.375\" text-anchor=\"middle\" font-size=\"12.5\">Ask for the body's message in words (“What is the tightness saying?”),<\/text><text x=\"320.0\" y=\"195.875\" text-anchor=\"middle\" font-size=\"12.5\">then work the two statements against each other.<\/text><\/svg>\n```\n\n**Why it matters.** Incongruent messages often signal that the person holds **two conflicting generalizations** about the same area, such as *\"I should always appreciate my mother\"* and *\"she always sided against me\"*. A person like that feels stuck, confused or swings between two behaviours.\n\n**Method.**\n1. Spot the mismatch (e.g., the clenched fist while speaking the \"should\").\n2. **Bring both parts into the same system.** Ask for the body's message in words.\n3. Work with the two verbal statements against each other until a richer model appears (*\"I appreciate her for some things and resent her for others\"*).\n\n**The signal of success.** The channels line up, and the experience of alignment is itself powerful and usually visible.\n\n**Congruity as a check.** The same experience of \"fit\" is what the *say-it-and-see-if-it-fits* safeguard relies on ([[meta-model/accept-ask-or-guess]]).\n\n*Related:* [[practice/digital-and-analogical-maps]], [[perception/self-confirming-loops]]", "links": ["meta-model/accept-ask-or-guess", "practice/digital-and-analogical-maps", "perception/self-confirming-loops"]}, {"id": "practice/digital-and-analogical-maps", "domain": "practice", "slug": "digital-and-analogical-maps", "title": "Digital and analogical maps", "entry_type": "concept", "tags": ["digital", "analogical", "representation-systems", "body"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Idea.** People map their experience in more than one system.\n\n| System | Nature | Examples |\n|---|---|---|\n| **Digital** | discrete symbols | spoken and written language |\n| **Analogical** | continuous | body posture, gesture, facial expression, voice tone and volume |\n| **Mixed** | both together | dreams; speech carried by a voice |\n\nThe Meta-model works on the digital one because language has an explicit structure we can describe. The same *kinds* of limitation (generalization, deletion, distortion) are present in all of them, since the same nervous system produces them.\n\n**Shifting systems.** Moving someone's experience from one system to another can be powerful. The book's example: someone with a headache (represented as a body sensation). If she is good at visual imagery, ask her to close her eyes and form a clear image of the headache, or breathe out onto a chair in front of her and see it there. Representing it visually removes the pain from the system that was producing it.\n\n**Why this matters for learning communication.** Most of what is said is a mix. Voice tone and posture carry much of the message ([[practice/congruity-and-incongruity]]).\n\n**Forward note.** The authors say Volume II will give a method for identifying a person's preferred representational system and for changing between systems. That is not in this volume, so nothing here covers it.\n\n*Related:* [[practice/reference-structures]]", "links": ["practice/congruity-and-incongruity", "practice/reference-structures"]}, {"id": "practice/enactment", "domain": "practice", "slug": "enactment", "title": "Enactment", "entry_type": "technique", "tags": ["enactment", "replay", "reference-structure"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** Having the person act out a real or imagined episode, alone or with others, instead of only describing it.\n\n**Why the authors like it.**\n1. It brings the person much closer to the **reference structure**, the actual experience the words came from.\n2. Missing pieces appear on their own as the scene is re-lived (deleted parts return).\n3. Vague, unfocused parts become specific, which is the experiential version of supplying a referential index.\n4. It turns an event back into a process (the reverse of nominalization) and fills in the verbs.\n\n**Combine with the Meta-model.** While the scene runs, have the person narrate what they experience. Each narrated sentence is surface structure, so every Meta-model question still applies. You can also check that all five senses and the feelings are present in the scene.\n\n**A bonus for the listener.** You get a live sample of how this person models: compare what they *do* in the replay with what they *said* about it, and you see their typical generalizations, deletions and distortions.\n\n**Limits noted.** Reliving an experience does not automatically contradict a belief. The authors give a case where enactment found the *source* of a rule but did not loosen it. That needed a second step ([[practice/therapeutic-double-binds]]).\n\n**Everyday cousin.** Role-playing a hard conversation before you have it does the same job: you meet details that your description skipped.\n\n*Part of:* [[practice/reference-structures]]", "links": ["practice/therapeutic-double-binds", "practice/reference-structures"]}, {"id": "practice/families-hold-many-models", "domain": "practice", "slug": "families-hold-many-models", "title": "Families hold many models", "entry_type": "concept", "tags": ["family-systems", "models", "complexity"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The observation.** When several people interact, there is more than a collection of individual models. Each person also holds a model of *themselves in relation to the others*, and the group has a **shared model of itself**.\n\n**A count (three people).** For family members a, b and c, the book lists fifteen separate models in play: each person's model of themself (3), and each person's model of every pairing and of the whole trio that includes or excludes them (12). Add a fourth person and the number rises sharply.\n\n**What follows.**\n- **Pain marks impoverishment** in a group as it does in an individual: look for areas of repeated dissatisfaction.\n- **Strategy gets harder:** whose model do you widen first? How congruent are the models each person assumes the others share? These issues do not arise one-to-one.\n- **Congruity matters more:** the authors draw on Satir and Bateson, noting that persistent incongruent messaging within families is claimed to be a source of serious distress.\n\n**Scope.** The authors say this volume does not give a Meta-model for families and promise one in Volume II. Treat this as a map of the problem, not a method.\n\n**Everyday echo.** Teams and couples argue about \"what we are like\" as well as about facts. Asking each person for *their* picture of \"us\" often shows the models differ.\n\n*Related:* [[practice/congruity-and-incongruity]], [[perception/map-and-territory]]", "links": ["practice/congruity-and-incongruity", "perception/map-and-territory"]}, {"id": "practice/feelings-about-feelings", "domain": "practice", "slug": "feelings-about-feelings", "title": "Feelings about feelings", "entry_type": "technique", "tags": ["satir", "self-esteem", "level-shift"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The move.** After someone tells you how they feel about a situation, ask how they feel **about feeling that way**. In Virginia Satir's work this moves one level up, from the event to the person's relationship with their own reaction.\n\n**Shape of the exchange (new example).**\n> *\"My co-founder just doesn't care about deadlines.\"* (mind-reading)\n> How do you know she doesn't care? → *\"She said, 'Deadlines are made up.'\"*\n> How do you feel about her saying that? → *\"Furious. We fight about it constantly.\"*\n> **How do you feel about feeling furious?** → *\"Honestly, not great about it.\"*\n\n**What the authors say it does.**\n- It reaches the person's **self-image**, which they link to self-esteem.\n- A change at that level spreads: a person's picture of themselves shapes how they organize all their experience.\n- Clients are often briefly confused by the level shift. Repeat the question calmly; people have the resources for it.\n\n**Combine it with the Meta-model.** The answer to the \"feelings about feelings\" question is itself a sentence you can listen to with the Meta-model's checks (*\"not great\"*: about what? compared to what?).\n\n**Care.** It reaches tender territory. Use it where there is trust and permission, and let the person decide how far to go.\n\n*Part of:* [[practice/reference-structures]]", "links": ["practice/reference-structures"]}, {"id": "practice/guided-fantasy-and-metaphor", "domain": "practice", "slug": "guided-fantasy-and-metaphor", "title": "Guided fantasy and metaphor", "entry_type": "technique", "tags": ["imagination", "metaphor", "new-experience"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**What it is.** Using guided imagination to create an experience the person has never had, where their model has little or nothing to draw on.\n\n**When to use it.** Where a person is facing something they want and fear, and has no pictures of how it could go. In the book's example, a father who has never expressed tenderness to his son imagines doing it.\n\n**What it provides.**\n1. A **new reference structure** where none existed: something to guide future behaviour.\n2. A way to **challenge a generalization** by building an experience that contradicts it. If someone believes \"I can never be angry at anyone\", imagining anger at *anyone* (it need not be the real target) breaks the rule.\n\n**Fantasy as metaphor.** The book notes fantasies often arrive as a metaphor for the real problem: a person in panic imagines standing at the edge of a ravine, is guided down and back up, and comes back calmer. The imagined problem and the real one share a *structure* (a daunting unknown to be crossed), so succeeding in the first changes the second. The authors credit Milton Erickson for this solution-by-metaphor idea.\n\n**Method notes.** Ask the person to report as they go. Ask for sight, sound, feeling, smell. Reassure them as obstacles appear. Then use the Meta-model on what they report.\n\n**Link to the language patterns.** The authors liken it to recovering a *large-scale deletion* in a modal operator: the thing the person says is impossible gets pictured.\n\n*Part of:* [[practice/reference-structures]] · *Compare:* [[practice/enactment]]", "links": ["practice/reference-structures", "practice/enactment"]}, {"id": "practice/practice-routine", "domain": "practice", "slug": "practice-routine", "title": "Practice routine", "entry_type": "technique", "tags": ["practice", "training", "inner-voice"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The book states plainly: learning the patterns needs **practice**, and the exercises are the point. A routine drawn from its three exercises and its closing advice:\n\n**1. Imagery check (Exercise A).** Read a short sentence, close your eyes, picture it. Mark each detail *said* or *supplied*. ([[meta-model/separate-what-is-said-from-what-you-supply]])\n\n**2. Pattern drills (Chapter 4).** Take a handful of sentences and for each:\n- find the verbs and count the slots ([[meta-model/deletion/unspecified-slots]]);\n- find comparatives, *-ly* words and *must/can't* ([[meta-model/deletion/deletion-patterns-at-a-glance]]);\n- test nominalizations with *\"an ongoing ___\"* or the wheelbarrow ([[meta-model/distortion/nominalization]]);\n- ask whether each noun has a referential index ([[meta-model/generalization/who-or-what-specifically]]);\n- run the negation test for presuppositions;\n- check for *makes me feel*, *but*, and mind-reading.\n\n**3. Your own inner voice (Exercise C).** Record yourself saying your thoughts aloud, then run the checks on the recording. Later, simply notice the inner dialogue and apply the checks live. This gives you a limitless supply of sentences.\n\n**4. Cover and compare.** For any exercise with a provided answer, write yours first, then compare. The goal is to sharpen your own intuition, not to match the book's wording.\n\n**5. Expect the awkward phase.** The step-by-step feel is temporary. After practice you work by the rules without stepping through them.\n\n**6. Quality check:** after asking, the answer is a new sentence. Practise hearing *that* one too.\n\n*Part of:* [[meta-model/the-meta-model]]", "links": ["meta-model/separate-what-is-said-from-what-you-supply", "meta-model/deletion/unspecified-slots", "meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/distortion/nominalization", "meta-model/generalization/who-or-what-specifically", "meta-model/the-meta-model"]}, {"id": "practice/reference-structures", "domain": "practice", "slug": "reference-structures", "title": "Reference structures", "entry_type": "framework", "tags": ["reference-structure", "experience", "source"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The idea.** Deep structure is the fullest *linguistic* version of a statement, but it is not the bottom. It comes from a richer source: the sum of the speaker's experience. The authors call that source the **reference structure** of the sentence.\n\n```svg\n<svg viewBox=\"0 0 660 380\" role=\"img\" aria-label=\"Ladder from the world through reference structure and deep structure to surface structure\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"120\" y=\"10\" width=\"420\" height=\"52\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"31.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">The world<\/text><text x=\"330.0\" y=\"49.9\" text-anchor=\"middle\" font-size=\"14\">what is actually there<\/text><line x1=\"330\" y1=\"62\" x2=\"330\" y2=\"86\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"520\" y=\"80\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3b82c4\" font-style=\"italic\">neurological, social, individual filters<\/text><rect x=\"120\" y=\"88\" width=\"420\" height=\"60\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"105.875\" text-anchor=\"middle\" font-size=\"12.5\">Reference structure<\/text><text x=\"330.0\" y=\"122.375\" text-anchor=\"middle\" font-size=\"12.5\">the sum of your experience: senses, feelings,<\/text><text x=\"330.0\" y=\"138.875\" text-anchor=\"middle\" font-size=\"12.5\">past rules, present awareness, expectations<\/text><line x1=\"330\" y1=\"148\" x2=\"330\" y2=\"172\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"520\" y=\"166\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#d9822b\" font-style=\"italic\">generalize, delete, distort<\/text><rect x=\"120\" y=\"174\" width=\"420\" height=\"52\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"196.05\" text-anchor=\"middle\" font-size=\"13\">Deep structure<\/text><text x=\"330.0\" y=\"213.05\" text-anchor=\"middle\" font-size=\"13\">the complete linguistic version<\/text><line x1=\"330\" y1=\"226\" x2=\"330\" y2=\"250\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"520\" y=\"244\" text-anchor=\"middle\" font-size=\"11.5\" fill=\"#3aa17e\" font-style=\"italic\">transformations<\/text><rect x=\"120\" y=\"252\" width=\"420\" height=\"52\" rx=\"9\" fill=\"#3aa17e\" fill-opacity=\".14\" stroke=\"#3aa17e\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"274.05\" text-anchor=\"middle\" font-size=\"13\">Surface structure<\/text><text x=\"330.0\" y=\"291.05\" text-anchor=\"middle\" font-size=\"13\">the sentence actually spoken<\/text><line x1=\"40\" y1=\"100\" x2=\"40\" y2=\"290\" stroke=\"currentColor\" stroke-width=\"1.2\"/><line x1=\"40\" y1=\"290\" x2=\"40\" y2=\"292\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"40\" y=\"320\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">each step down<\/text><text x=\"40\" y=\"336\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">is a reduction<\/text><text x=\"330\" y=\"350\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Meta-model questions climb back up this ladder<\/text><\/svg>\n```\n\n**Three mechanisms act at every step** (generalization, deletion, distortion). That is why the Meta-model's questions work on both levels: they recover what the sentence dropped, and they recover what the person's *model* dropped from experience.\n\n**Checklist for a complete reference structure.** The authors offer a starter set, not a finished theory:\n\n1. **All five senses.** Does the account include what was seen, heard, felt, tasted, smelled? A missing channel is a place to ask.\n2. **Satir's components:** (a) the context (what is happening), (b) the speaker's feelings about it, (c) their perception of what others feel about it. Feelings are a necessary part of any complete account.\n3. **A fourth, at a higher level:** the speaker's feelings *about* those feelings ([[practice/feelings-about-feelings]]).\n4. **Time frames:** how the speaker carries the *past* into the present (often as rules), what they notice in the *present*, and what they *expect* of the future. Each of the earlier components can appear in each time frame.\n\n**Frank limit.** The authors say they have **no complete theory** of what the necessary components are; this is a set of useful checks. They note philosophers and semanticists have offered others and promise more in Volume II.\n\n**Why it matters.** The reference structure is where new information has to come from. Questions work on the words; experience (see [[practice/enactment]] and [[practice/guided-fantasy-and-metaphor]]) works on the source.\n\n*Related:* [[language/deep-structure-and-surface-structure]], [[perception/map-and-territory]]", "links": ["practice/feelings-about-feelings", "practice/enactment", "practice/guided-fantasy-and-metaphor", "language/deep-structure-and-surface-structure", "perception/map-and-territory"]}, {"id": "practice/therapeutic-double-binds", "domain": "practice", "slug": "therapeutic-double-binds", "title": "Therapeutic double binds", "entry_type": "technique", "tags": ["double-bind", "paradox", "contradicting-experience"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 5–6 (pp. 108–178)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The idea.** When someone holds a limiting generalization (*\"I can't say no without hurting someone\"*), set up a situation where **either possible response contradicts the generalization**.\n\n**Worked case from the book (recast).**\n- The person: *\"I can't say NO to anyone.\"*\n- The task given: *\"Say NO to each person in this room.\"*\n- Her choices: (a) say no to each one, which breaks the rule; or (b) refuse the task, which means saying NO to the person who gave it. Either way, she has said no. The authors then point out nothing terrible followed.\n\n**The homework version.** Someone says, *\"I can't try anything new because I might fail.\"* The task: *\"Each day, try something new and fail at it.\"* She can complete it (new things, with failures that turn out survivable) or fail to complete it (a new, survivable failure). Either result adds experience that the rule did not predict.\n\n**Structure to remember.**\n1. Identify the generalization (often a cause-effect or a modal limit).\n2. Frame a task in which every branch contradicts it.\n3. Make the contradiction explicit afterwards, using Meta-model questions.\n\n**Sequence the authors suggest.** First try: ask whether the rule is always true; then enactment; then guided fantasy; and only then, or by preference, a double bind.\n\n**Cautions.**\n- This is a *clinical* tool taken from the authors' practice and from Jay Haley's work. It uses leverage on someone and is not suitable for casual use on friends or colleagues.\n- It depends on trust and on the person's real consent to the task. Treat this entry as understanding how such interventions work, not as a recipe.\n\n*Part of:* [[practice/reference-structures]] · *Rooted in:* [[meta-model/generalization/challenging-a-generalization]]", "links": ["practice/reference-structures", "meta-model/generalization/challenging-a-generalization"]}, {"id": "sources/the-structure-of-magic-i-som1", "domain": "sources", "slug": "the-structure-of-magic-i-som1", "title": "The Structure of Magic I (som1)", "entry_type": "text", "tags": ["som1", "bandler-grinder", "meta-model"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), whole book", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Book.** Richard Bandler and John Grinder, *The Structure of Magic I: A Book about Language and Therapy* (1975). Key `som1`. Staged text: `~/.magic-hub/ingest/som1/raw.txt` (OCR text layer; the PDF's page images hold the original diagrams, which were redrawn as SVG in the entries).\n\n**What the book is.** The founding text of the Meta-model: a set of listening patterns and questions, built from transformational grammar, for noticing where people's language drops, freezes or hardens their experience, and for widening it. Volume II (representational systems, incongruity, family systems) is announced but not part of this entry.\n\n**How it was ingested.** Own-words summaries with new examples. Most of the book's exercises were not copied; Chapter 5's two transcripts were skipped on purpose (their lessons are in [[practice/choosing-a-thread-in-a-conversation]]); Appendix A was folded into the `language` entries; Appendix B and the glossary got their own entries.\n\n## Entry map\n\n| Book part | Entries |\n|---|---|\n| Warning to the Reader, Ch. 1 *The Structure of Choice* | [[perception/map-and-territory]], [[perception/neurological-filters]], [[perception/social-filters]], [[perception/individual-filters]], [[perception/impoverished-models-and-few-choices]], [[perception/generalization-deletion-and-distortion]], [[perception/self-confirming-loops]], [[perception/expectation-shapes-what-you-see]], [[perception/behavior-makes-sense-inside-the-model]] |\n| Ch. 2 *The Structure of Language* | [[language/two-uses-of-language]], [[language/language-is-rule-governed]], [[language/the-three-native-speaker-intuitions]], [[language/well-formedness]], [[language/constituent-structure-and-trees]], [[language/verbs-and-their-slots]], [[language/ambiguity]], [[language/synonymy-and-the-paraphrase-test]], [[language/referential-index]], [[language/presupposition]], [[language/deep-structure-and-surface-structure]], [[language/transformations]] |\n| Ch. 3 *The Structure of Magic* | [[meta-model/the-meta-model]], [[meta-model/accept-ask-or-guess]], [[meta-model/ask-how-not-why]], [[meta-model/don-t-advise-into-the-gap]], [[meta-model/well-formed-for-change]] |\n| Ch. 4 *Incantations for Growth*: Exercise A | [[meta-model/separate-what-is-said-from-what-you-supply]] |\n| Ch. 4, Deletion | [[meta-model/deletion/deletion-patterns-at-a-glance]] and its seven pattern entries |\n| Ch. 4, Distortion | [[meta-model/distortion/distortion-patterns-at-a-glance]], [[meta-model/distortion/nominalization]], [[meta-model/distortion/reversing-nominalizations]], [[meta-model/distortion/presuppositions-in-sentences]], [[meta-model/distortion/cause-and-effect]], [[meta-model/distortion/implied-causatives]], [[meta-model/distortion/mind-reading]], [[meta-model/distortion/lost-performative]] |\n| Ch. 4, Generalization | [[meta-model/generalization/generalization-patterns-at-a-glance]] and its seven pattern entries |\n| Ch. 4, Exercise C | [[practice/practice-routine]] |\n| Ch. 5 *Into the Vortex* | [[practice/choosing-a-thread-in-a-conversation]] |\n| Ch. 6 *On Becoming a Sorcerer's Apprentice* | [[practice/reference-structures]], [[practice/feelings-about-feelings]], [[practice/enactment]], [[practice/guided-fantasy-and-metaphor]], [[practice/therapeutic-double-binds]], [[practice/digital-and-analogical-maps]], [[practice/congruity-and-incongruity]], [[practice/families-hold-many-models]] |\n| Appendix A | [[language/grammar-as-a-rewrite-system]] (plus material folded into the `language` entries) |\n| Appendix B, Glossary | [[meta-model/distortion/presupposition-triggers]], [[meta-model/glossary-of-meta-model-terms]] |\n\n## Editorial notes\n\n- **Dated and clinical.** The book dates from 1975 and speaks from therapy practice. Claims such as \"the swapped sentence is often psychologically true\" (projection) and the double-bind techniques are the authors' clinical observations, not tested results. Entries flag this where it matters.\n- **The authors' own caveats** are kept: the three-way split into generalization, deletion and distortion is a convenience; the reference-structure checklist is a starting set; the transcripts are artificially restricted to Meta-model questions.\n- **Riddle-style passages.** The preface fable (*The Prince and the Magician*) and chapter-opening quotations carry the book's stance that every model is a magician's trick we can learn to see through. They are not summarised as entries; the stance appears in [[perception/map-and-territory]].", "links": ["practice/choosing-a-thread-in-a-conversation", "perception/map-and-territory", "perception/neurological-filters", "perception/social-filters", "perception/individual-filters", "perception/impoverished-models-and-few-choices", "perception/generalization-deletion-and-distortion", "perception/self-confirming-loops", "perception/expectation-shapes-what-you-see", "perception/behavior-makes-sense-inside-the-model", "language/two-uses-of-language", "language/language-is-rule-governed", "language/the-three-native-speaker-intuitions", "language/well-formedness", "language/constituent-structure-and-trees", "language/verbs-and-their-slots", "language/ambiguity", "language/synonymy-and-the-paraphrase-test", "language/referential-index", "language/presupposition", "language/deep-structure-and-surface-structure", "language/transformations", "meta-model/the-meta-model", "meta-model/accept-ask-or-guess", "meta-model/ask-how-not-why", "meta-model/don-t-advise-into-the-gap", "meta-model/well-formed-for-change", "meta-model/separate-what-is-said-from-what-you-supply", "meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/nominalization", "meta-model/distortion/reversing-nominalizations", "meta-model/distortion/presuppositions-in-sentences", "meta-model/distortion/cause-and-effect", "meta-model/distortion/implied-causatives", "meta-model/distortion/mind-reading", "meta-model/distortion/lost-performative", "meta-model/generalization/generalization-patterns-at-a-glance", "practice/practice-routine", "practice/choosing-a-thread-in-a-conversation", "practice/reference-structures", "practice/feelings-about-feelings", "practice/enactment", "practice/guided-fantasy-and-metaphor", "practice/therapeutic-double-binds", "practice/digital-and-analogical-maps", "practice/congruity-and-incongruity", "practice/families-hold-many-models", "language/grammar-as-a-rewrite-system", "meta-model/distortion/presupposition-triggers", "meta-model/glossary-of-meta-model-terms", "perception/map-and-territory"]}], "proposals": [], "order": {"book": "The Structure of Magic I", "authors": "Richard Bandler and John Grinder, 1975", "parts": [{"title": "Maps, not territory", "book": "Warning to the Reader and Chapter 1", "blurb": "You act on a model of the world, never on the world. Three layers of filter shape that model, and three processes build and limit it.", "ids": ["perception/map-and-territory", "perception/neurological-filters", "perception/social-filters", "perception/individual-filters", "perception/impoverished-models-and-few-choices", "perception/generalization-deletion-and-distortion", "perception/self-confirming-loops", "perception/expectation-shapes-what-you-see", "perception/behavior-makes-sense-inside-the-model"]}, {"title": "How language carries the map", "book": "Chapter 2", "blurb": "Language is a model of a model. Its patterns are regular, and you already know them without being able to say them.", "ids": ["language/two-uses-of-language", "language/language-is-rule-governed", "language/the-three-native-speaker-intuitions", "language/well-formedness", "language/constituent-structure-and-trees", "language/verbs-and-their-slots", "language/ambiguity", "language/synonymy-and-the-paraphrase-test", "language/referential-index", "language/presupposition", "language/deep-structure-and-surface-structure", "language/transformations", "language/grammar-as-a-rewrite-system"]}, {"title": "The Meta-model", "book": "Chapter 3 and Exercise A", "blurb": "Listen for what a sentence leaves out, then choose: accept it, ask for it, or guess it and let the speaker check.", "ids": ["meta-model/the-meta-model", "meta-model/separate-what-is-said-from-what-you-supply", "meta-model/accept-ask-or-guess", "meta-model/ask-how-not-why", "meta-model/don-t-advise-into-the-gap", "meta-model/well-formed-for-change"]}, {"title": "Deletion: what is missing", "book": "Chapter 4", "blurb": "Sentences with fewer parts than their verbs need, and rules announced by must and can't.", "ids": ["meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/deletion/unspecified-slots", "meta-model/deletion/adjectives-that-hide-verbs", "meta-model/deletion/comparatives-and-superlatives", "meta-model/deletion/ly-adverbs", "meta-model/deletion/modal-operators-of-necessity", "meta-model/deletion/modal-operators-of-possibility"]}, {"title": "Distortion: what is twisted", "book": "Chapter 4", "blurb": "Processes frozen into things, assumptions slipped in, causes and minds assumed without a mechanism.", "ids": ["meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/distortion/nominalization", "meta-model/distortion/reversing-nominalizations", "meta-model/distortion/presuppositions-in-sentences", "meta-model/distortion/presupposition-triggers", "meta-model/distortion/cause-and-effect", "meta-model/distortion/implied-causatives", "meta-model/distortion/mind-reading", "meta-model/distortion/lost-performative"]}, {"title": "Generalization: what became a rule", "book": "Chapter 4", "blurb": "One case stretched over a whole category. Put the detail back and the rule loosens.", "ids": ["meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/generalization/who-or-what-specifically", "meta-model/generalization/universal-quantifiers", "meta-model/generalization/challenging-a-generalization", "meta-model/generalization/incompletely-specified-verbs", "meta-model/generalization/shifting-referential-indices", "meta-model/generalization/or-rules-to-if-then", "meta-model/generalization/complex-equivalence"]}, {"title": "Beyond the words", "book": "Chapters 5 and 6", "blurb": "The experience beneath the sentence, other ways to reach it, and how to practise until the questions become automatic.", "ids": ["practice/choosing-a-thread-in-a-conversation", "practice/reference-structures", "practice/feelings-about-feelings", "practice/enactment", "practice/guided-fantasy-and-metaphor", "practice/therapeutic-double-binds", "practice/digital-and-analogical-maps", "practice/congruity-and-incongruity", "practice/families-hold-many-models", "practice/practice-routine"]}, {"title": "Reference", "book": "Glossary and sources", "blurb": "Terms and the map from this book to these entries.", "ids": ["meta-model/glossary-of-meta-model-terms", "sources/the-structure-of-magic-i-som1"]}]}}</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const byId = new Map(DATA.entries.map(e => [e.id, e]));
const fold = s => (s || '').normalize('NFD').replace(/\p{M}/gu, '').toLowerCase();
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $ = id => document.getElementById(id);

// ---- reading order: parts from kb/reader-order.json, leftovers appended in a final part
const order = DATA.order || { book: '', authors: '', parts: [] };
const parts = order.parts.map(p => ({...p, ids: p.ids.filter(i => byId.has(i))}));
const placed = new Set(parts.flatMap(p => p.ids));
const extra = DATA.entries.filter(e => !placed.has(e.id)).map(e => e.id);
if (extra.length) parts.push({ title: 'More entries', book: '', blurb: 'Entries not yet placed in the reading order.', ids: extra });
const flat = parts.flatMap((p, pi) => p.ids.map(id => ({ id, pi })));
const partOf = id => parts[flat.find(f => f.id === id).pi];

// ---- read state (per-viewer convenience only)
let readSet = new Set();
try { readSet = new Set(JSON.parse(localStorage.getItem('magichub-read') || '[]')); } catch (_) {}
const saveRead = () => { try { localStorage.setItem('magichub-read', JSON.stringify([...readSet])); } catch (_) {} };

// ---- markdown
function resolve(ref, from) {
  if (ref.startsWith('chub:')) return null;
  if (byId.has(ref)) return ref;
  if (byId.has(from.domain + '/' + ref)) return from.domain + '/' + ref;
  const hit = DATA.entries.find(e => e.slug === ref);
  return hit ? hit.id : null;
}
function inline(text, entry) {
  const stash = [];
  const keep = h => '\u0000' + (stash.push(h) - 1) + '\u0000';
  let s = esc(text)
    .replace(/`([^`]+)`/g, (_, c) => keep('<code>' + c + '</code>'))
    .replace(/\[\[([^\[\]|]+?)\]\]/g, (_, ref) => {
      ref = ref.trim(); const id = resolve(ref, entry);
      return keep(id ? `<button class="xref" data-go="${id}">${esc(byId.get(id).title)}</button>` : `<span class="broken">${esc(ref)}</span>`);
    })
    .replace(/\\\*/g, '\u0001')
    .replace(/\*\*([^*]+?)\*\*/g, '<strong>$1</strong>')
    .replace(/(^|[^\w*])\*(?!\s)([^*]+?)(?<!\s)\*(?![\w*])/g, '$1<em>$2</em>')
    .replace(/\u0001/g, '*')
    .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener" class="xref">$1</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[+i]);
}
function mdTable(lines, entry) {
  const cells = l => l.trim().replace(/^\||\|$/g, '').split(/(?<!\\)\|/).map(c => c.trim().replace(/\\\|/g, '|'));
  const head = cells(lines[0]), rows = lines.slice(2).map(cells);
  return '<div class="tablewrap"><table><thead><tr>' + head.map(c => `<th>${inline(c, entry)}</th>`).join('') + '</tr></thead><tbody>' +
    rows.map(r => '<tr>' + r.map(c => `<td>${inline(c, entry)}</td>`).join('') + '</tr>').join('') + '</tbody></table></div>';
}
function markdown(body, entry) {
  const out = [], lines = body.replace(/\r/g, '').split('\n');
  let i = 0;
  while (i < lines.length) {
    const l = lines[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith('```')) {
      const lang = l.slice(3).trim(), buf = []; i++;
      while (i < lines.length && !lines[i].startsWith('```')) buf.push(lines[i++]); i++;
      out.push(lang === 'svg' ? `<div class="diagram">${buf.join('\n')}</div>` : `<pre><code>${esc(buf.join('\n'))}</code></pre>`);
    } else if (/^#{1,6} /.test(l)) {
      const lvl = Math.min(4, l.match(/^#+/)[0].length + 1);
      out.push(`<h${lvl}>${inline(l.replace(/^#+ /, ''), entry)}</h${lvl}>`); i++;
    } else if (l.trim().startsWith('|') && /^\s*\|?\s*:?-{2,}/.test(lines[i + 1] || '')) {
      const buf = []; while (i < lines.length && lines[i].trim().startsWith('|')) buf.push(lines[i++]);
      out.push(mdTable(buf, entry));
    } else if (/^>/.test(l)) {
      const buf = []; while (i < lines.length && /^>/.test(lines[i])) buf.push(lines[i++].replace(/^>\s?/, ''));
      out.push('<blockquote>' + buf.join('\n').split(/\n{2,}/).map(p => `<p>${inline(p, entry).replace(/\n/g, '<br>')}</p>`).join('') + '</blockquote>');
    } else if (/^\s*([-*]|\d+\.) /.test(l)) {
      const ordered = /^\s*\d+\./.test(l), buf = [];
      while (i < lines.length && /^\s*([-*]|\d+\.) /.test(lines[i])) buf.push(lines[i++].replace(/^\s*([-*]|\d+\.) /, ''));
      const tag = ordered ? 'ol' : 'ul';
      out.push(`<${tag}>` + buf.map(x => `<li>${inline(x, entry)}</li>`).join('') + `</${tag}>`);
    } else if (/^---+$/.test(l.trim())) { out.push('<hr>'); i++; }
    else {
      const buf = []; while (i < lines.length && lines[i].trim() && !/^(```|#{1,6} |>|\s*([-*]|\d+\.) )/.test(lines[i]) && !lines[i].trim().startsWith('|')) buf.push(lines[i++]);
      if (!buf.length) { buf.push(lines[i++]); }
      out.push(`<p>${inline(buf.join('\n'), entry).replace(/\n/g, '<br>')}</p>`);
    }
  }
  return out.join('\n');
}

// ---- views
const view = $('view'), main = $('main');
let currentId = null;
const tokenOf = id => id.replace(/\//g, '--');
const fromToken = t => [...byId.keys()].find(id => tokenOf(id) === t);
function setHash(t) { try { history.replaceState(null, '', t ? '#' + t : location.pathname); } catch (_) {} }

function renderToc(filter) {
  const toc = $('toc'); toc.innerHTML = '';
  parts.forEach((p, pi) => {
    const wrap = document.createElement('div'); wrap.className = 'part';
    const done = p.ids.filter(id => readSet.has(id)).length;
    wrap.innerHTML = `<h2 data-part="${pi}">${esc(p.title)}<small>${done}/${p.ids.length}</small></h2>`;
    const ul = document.createElement('ul');
    for (const id of p.ids) {
      if (filter && !filter.has(id)) continue;
      const li = document.createElement('li');
      li.innerHTML = `<button class="item ${readSet.has(id) ? 'read' : ''}" data-go="${id}" ${id === currentId ? 'aria-current="true"' : ''}><span class="dot"></span><span>${esc(byId.get(id).title)}</span></button>`;
      ul.appendChild(li);
    }
    if (ul.children.length) { wrap.appendChild(ul); toc.appendChild(wrap); }
  });
  const total = flat.length, done = flat.filter(f => readSet.has(f.id)).length;
  $('pcount').textContent = `${done}/${total} read`;
  $('barfill').style.width = (total ? 100 * done / total : 0) + '%';
}
function showCover() {
  currentId = null; $('readbtn').hidden = true; $('crumb').textContent = 'Reader'; setHash('');
  view.innerHTML = `<div class="cover"><div class="eyebrow"><span class="chip">Book 1</span><span>${esc(order.authors)}</span></div>
    <h1>${esc(order.book || 'MagicHub')}</h1>
    <p class="lede">A personal study guide to how language carries a person's map of the world, and the questions that read it back. Entries are written in my own words with new examples, and the diagrams are redrawn.</p>
    ${parts.map((p, pi) => `<button class="p" data-go="${p.ids[0]}"><small>${p.ids.length} entries</small><b>${esc(p.title)}</b><span>${esc(p.blurb)}</span></button>`).join('')}</div>`;
  main.scrollTop = 0; renderToc();
}
function show(id, scroll = true) {
  const e = byId.get(id); if (!e) return showCover();
  currentId = id; const p = partOf(id), idx = flat.findIndex(f => f.id === id);
  $('crumb').textContent = `${p.title}`; $('readbtn').hidden = false; syncRead(); setHash(tokenOf(id));
  const back = DATA.entries.filter(o => o.links.some(l => resolve(l, o) === id)).slice(0, 12);
  const fwd = [...new Set(e.links.map(l => resolve(l, e)).filter(Boolean))].slice(0, 12);
  const prev = flat[idx - 1], next = flat[idx + 1];
  view.innerHTML = `<article>
    <div class="eyebrow"><span class="chip">${esc(e.entry_type)}</span><span>${esc(e.domain.split('/').join(' / '))}</span></div>
    <h1>${esc(e.title)}</h1>
    <div class="body">${markdown(e.body, e)}</div>
    ${fwd.length ? `<div class="related"><h3>Connects to</h3><div class="row">${fwd.map(r => `<button class="xref" data-go="${r}">${esc(byId.get(r).title)}</button>`).join('')}</div></div>` : ''}
    ${back.length ? `<div class="related"><h3>Referenced by</h3><div class="row">${back.map(r => `<button class="xref" data-go="${r.id}">${esc(r.title)}</button>`).join('')}</div></div>` : ''}
    <div class="source">${esc(e.source || '')}</div>
    <div class="pager">${prev ? `<button data-go="${prev.id}"><small>Previous</small><span>${esc(byId.get(prev.id).title)}</span></button>` : '<span></span>'}
      ${next ? `<button data-go="${next.id}"><small>Next</small><span>${esc(byId.get(next.id).title)}</span></button>` : '<span></span>'}</div>
  </article>`;
  if (scroll) main.scrollTop = 0;
  renderToc(); $('rail').classList.remove('open');
}
function syncRead() {
  const b = $('readbtn'), on = currentId && readSet.has(currentId);
  b.textContent = on ? 'Read' : 'Mark as read'; b.classList.toggle('on', !!on);
}
function search(qs) {
  const terms = fold(qs).split(/\s+/).filter(Boolean);
  const hits = DATA.entries.map(e => {
    const t = fold(e.title), b = fold(e.body), tags = fold((e.tags || []).join(' '));
    if (!terms.every(w => t.includes(w) || b.includes(w) || tags.includes(w))) return null;
    return { e, score: terms.reduce((s, w) => s + (t.includes(w) ? 5 : 0) + (tags.includes(w) ? 2 : 0), 0) };
  }).filter(Boolean).sort((a, b) => b.score - a.score);
  const hl = s => { let r = esc(s); for (const w of terms) r = r.replace(new RegExp('(' + w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig'), '<mark>$1</mark>'); return r; };
  const snippet = e => {
    const plain = e.body.replace(/```svg[\s\S]*?```/g, ' ').replace(/[#*>|`\[\]]/g, ' ').replace(/\s+/g, ' ');
    const at = Math.max(0, fold(plain).indexOf(terms[0]) - 50);
    return plain.slice(at, at + 170);
  };
  currentId = null; $('readbtn').hidden = true; $('crumb').textContent = `Search: ${qs}`;
  view.innerHTML = `<div class="hits"><div class="eyebrow">${hits.length} result${hits.length === 1 ? '' : 's'}</div><div style="height:12px"></div>` +
    (hits.map(({ e }) => `<button class="hit" data-go="${e.id}"><b>${hl(e.title)}</b><small>${esc(partOf(e.id).title)}</small><p>${hl(snippet(e))}</p></button>`).join('') || '<p>No entries match. Try fewer words.</p>') + '</div>';
  main.scrollTop = 0; renderToc(new Set(hits.map(h => h.e.id)));
}

// ---- events
document.addEventListener('click', ev => {
  const go = ev.target.closest('[data-go]');
  if (go) { ev.preventDefault(); $('q').value = ''; show(go.dataset.go); return; }
  const ph = ev.target.closest('[data-part]');
  if (ph) { const ul = ph.parentElement.querySelector('ul'); if (ul) ul.hidden = !ul.hidden; }
});
$('readbtn').addEventListener('click', () => {
  if (!currentId) return;
  readSet.has(currentId) ? readSet.delete(currentId) : readSet.add(currentId);
  saveRead(); syncRead(); renderToc($('q').value ? undefined : undefined);
});
$('menu').addEventListener('click', () => $('rail').classList.toggle('open'));
$('q').addEventListener('input', e => { const v = e.target.value.trim(); v.length > 1 ? search(v) : (currentId ? show(currentId, false) : showCover()); });
$('bookline').textContent = `${order.book} · ${DATA.entries.length} entries · baked ${DATA.generated_at}`;
const start = fromToken(location.hash.slice(1));
start ? show(start) : showCover();
</script>

</body>
