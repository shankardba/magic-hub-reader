<style>
/* Layout: a survey-chart reader. Contents rail on the left (parts as map sheets), one reading column on the right.
   Palette: chart-paper grey-blue, deep ink, sounding-blue accent, survey-orange for marks. */
:root {
  --bg: #eaeff1; --panel: #f6f9fa; --fg: #14232b; --muted: #55686f; --line: #cbd6da;
  --accent: #1b6785; --accent-soft: #d3e6ee; --mark: #c4561c; --ok: #2f7d5b; --chip: #dfe8eb;
  --display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --read: "Newsreader", Georgia, "Times New Roman", serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0e171c; --panel: #142027; --fg: #e2ecef; --muted: #8fa5ad; --line: #26373f;
  --accent: #6cbad6; --accent-soft: #1b3541; --mark: #f08a54; --ok: #6cc59a; --chip: #1c2c34; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0e171c; --panel: #142027; --fg: #e2ecef; --muted: #8fa5ad; --line: #26373f;
  --accent: #6cbad6; --accent-soft: #1b3541; --mark: #f08a54; --ok: #6cc59a; --chip: #1c2c34; color-scheme: dark; }
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 18px/1.62 var(--read); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { display: grid; grid-template-columns: 310px minmax(0, 1fr); height: 100%; }
.rail { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 18px 14px 28px; min-width: 0; }
.brand { font: 700 20px/1.1 var(--display); letter-spacing: -.01em; }
.sub { font: 400 11.5px/1.4 var(--mono); color: var(--muted); margin-top: 4px; }
.search { width: 100%; margin: 14px 0 6px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--fg); font: 400 14px var(--mono); }
.progress { display: flex; align-items: center; gap: 8px; font: 400 11.5px var(--mono); color: var(--muted); margin: 6px 0 10px; }
.bar { flex: 1; height: 4px; background: var(--chip); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--ok); width: 0; }
.part { margin-top: 14px; }
.part h2 { font: 700 13.5px/1.25 var(--display); margin: 0; padding: 4px 0; cursor: pointer; display: flex; gap: 8px; align-items: baseline; }
.part h2 small { font: 400 10.5px var(--mono); color: var(--muted); margin-left: auto; white-space: nowrap; }
.part ul { list-style: none; margin: 2px 0 0; padding: 0; }
.item { display: flex; gap: 8px; width: 100%; text-align: left; background: none; border: 0; border-radius: 5px; padding: 5px 8px; cursor: pointer; font: 400 14.5px/1.3 var(--read); color: var(--fg); }
.item:hover { background: var(--chip); }
.item[aria-current="true"] { background: var(--accent-soft); font-weight: 600; }
.dot { flex: none; width: 9px; height: 9px; margin-top: 6px; border-radius: 50%; border: 1.5px solid var(--muted); }
.read .dot { background: var(--ok); border-color: var(--ok); }
.main { overflow-y: auto; min-width: 0; }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; gap: 10px; align-items: center; padding: 10px 24px; background: var(--bg); border-bottom: 1px solid var(--line); }
.top .crumb { font: 400 11.5px var(--mono); color: var(--muted); letter-spacing: .04em; text-transform: uppercase; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 6px; padding: 5px 11px; font: 500 12.5px var(--mono); cursor: pointer; }
.btn:hover { border-color: var(--accent); }
.btn.on { background: var(--ok); border-color: var(--ok); color: var(--bg); }
#menu { display: none; }
article { max-width: 72ch; margin: 0 auto; padding: 30px 24px 70px; }
.eyebrow { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font: 500 11.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.chip { background: var(--chip); border-radius: 4px; padding: 2px 7px; }
h1 { font: 700 clamp(30px, 5vw, 44px)/1.08 var(--display); letter-spacing: -.02em; margin: 12px 0 18px; text-wrap: balance; }
.body { overflow-wrap: break-word; }
.body p, .body ul, .body ol, .body blockquote { margin: 0 0 14px; }
.body h2, .body h3, .body h4 { font: 700 21px/1.25 var(--display); margin: 26px 0 8px; }
.body ul, .body ol { padding-left: 24px; } .body li { margin-bottom: 5px; }
.body strong { font-weight: 600; }
.body blockquote { border-left: 3px solid var(--mark); padding: 2px 0 2px 16px; color: var(--fg); background: linear-gradient(90deg, var(--chip), transparent 70%); }
.body blockquote p { margin: 4px 0; }
.body code { font: 400 .84em var(--mono); background: var(--chip); padding: 1px 5px; border-radius: 3px; }
.body hr { border: 0; border-top: 1px solid var(--line); margin: 22px 0; }
.tablewrap { overflow-x: auto; margin: 6px 0 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); }
.body table { border-collapse: collapse; width: 100%; font: 400 15.5px/1.45 var(--read); }
.body th { text-align: left; font: 500 11px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 9px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.body td { vertical-align: top; padding: 8px 12px; border-bottom: 1px solid var(--line); min-width: 9ch; }
.body tr:last-child td { border-bottom: 0; }
.diagram { margin: 18px 0 22px; padding: 14px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow-x: auto; }
.diagram svg { display: block; width: 100%; height: auto; min-width: 460px; max-width: 720px; margin: 0 auto; color: var(--fg); }
.xref { color: var(--accent); background: none; border: 0; border-bottom: 1px solid var(--accent); padding: 0; cursor: pointer; font: inherit; }
.xref:hover { background: var(--accent-soft); }
.broken { color: var(--mark); }
.source { margin-top: 30px; padding-top: 14px; border-top: 1px solid var(--line); font: 400 12.5px/1.5 var(--mono); color: var(--muted); }
.related { margin-top: 22px; }
.related h3 { font: 500 11.5px var(--mono); letter-spacing: .07em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; }
.related .row { display: flex; flex-wrap: wrap; gap: 8px; }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 30px; }
.pager button { text-align: left; padding: 12px 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); cursor: pointer; min-width: 0; }
.pager button:hover { border-color: var(--accent); }
.pager small { display: block; font: 500 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.pager span { font: 600 16px/1.25 var(--display); display: block; margin-top: 3px; }
.pager button:last-child { text-align: right; }
.hits { padding: 30px 24px; max-width: 72ch; margin: 0 auto; }
.hit { display: block; width: 100%; text-align: left; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-bottom: 10px; cursor: pointer; }
.hit b { font: 700 17px var(--display); } .hit small { display: block; font: 400 12px var(--mono); color: var(--muted); margin-top: 2px; }
.hit p { margin: 6px 0 0; font-size: 15px; color: var(--muted); }
mark { background: var(--accent-soft); color: inherit; padding: 0 2px; border-radius: 2px; }
.cover { padding: 40px 24px 70px; max-width: 72ch; margin: 0 auto; }
.cover p.lede { font-size: 20px; color: var(--muted); margin: 0 0 22px; }
.cover .p { margin: 0 0 14px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); cursor: pointer; display: block; width: 100%; text-align: left; }
.cover .p:hover { border-color: var(--accent); }
.cover .p b { font: 700 18px var(--display); } .cover .p small { font: 400 11.5px var(--mono); color: var(--muted); float: right; }
.cover .p span { display: block; color: var(--muted); font-size: 15.5px; margin-top: 4px; }
@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: fixed; inset: 0 18% 0 0; z-index: 20; transform: translateX(-102%); transition: transform .2s; box-shadow: 4px 0 24px #0006; padding-top: calc(18px + env(safe-area-inset-top, 0px)); }
  .rail.open { transform: none; }
  #menu { display: inline-block; }
  .top { padding: 10px 16px; } article, .hits, .cover { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { .rail { transition: none; } }
</style>
</head>

<script type="application/json" id="data">{"generated_at": "2026-10-14 12:44 UTC", "domains": [{"domain": "language", "description": "Representation vs communication; well-formedness; constituent structure; deep and surface structure; transformations; presuppositions.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "meta-model", "description": "Overview of the Meta-model and how to use it; subdomains hold each pattern.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "meta-model/deletion", "description": "Unspecified nouns and verbs, comparatives, simple deletions.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "meta-model/distortion", "description": "Nominalizations, cause-effect, complex equivalence, mind reading, presuppositions.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "meta-model/generalization", "description": "Universal quantifiers, modal operators of necessity and possibility, lost performatives.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "perception", "description": "Maps and territory; the three filters (neurological, social, individual); how a model enriches or impoverishes choice.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "practice", "description": "Worked application and how the patterns fit with other methods.", "tier": "autonomous", "created": "2026-10-14"}, {"domain": "sources", "description": "Entry maps for each book.", "tier": "autonomous", "created": "2026-10-14"}], "entries": [{"id": "language/ambiguity", "domain": "language", "slug": "ambiguity", "title": "Ambiguity", "entry_type": "concept", "tags": ["ambiguity", "semantics"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A sentence is **ambiguous** when the same surface form carries more than one meaning. Native speakers notice this directly.\n\nExamples (new):\n- *\"Flying planes can be scary.\"* (planes that fly are scary, or flying them is)\n- *\"She told him she would call him last night.\"* (the telling, or the calling, was last night)\n\nIn the model, ambiguity means that *more than one deep structure* leads to the same surface structure. The drawing is under [[language/synonymy-and-the-paraphrase-test]].\n\n**Use in communication.** Ambiguity is one reason a surface sentence cannot be trusted to carry exactly the speaker's meaning. When stakes are high, ask which meaning was intended. A quick way: restate it your way and ask \"is that what you meant?\"\n\n*Part of:* [[language/the-three-native-speaker-intuitions]]", "links": ["language/synonymy-and-the-paraphrase-test", "language/the-three-native-speaker-intuitions"]}, {"id": "language/constituent-structure-and-trees", "domain": "language", "slug": "constituent-structure-and-trees", "title": "Constituent structure and trees", "entry_type": "concept", "tags": ["constituents", "trees", "syntax"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Native speakers feel that some words belong together as a unit. In *\"The woman bought a truck\"*, **the** and **woman** belong together, and so do **a** and **truck**; and **bought a truck** forms a larger unit. A linguist draws this as a **tree** in which words that behave as one unit hang from the same node.\n\nThe tree gives the *surface structure*: how the sentence is packaged for speaking. It tells you which pieces move or disappear together, but not what the sentence *means*. For that you need the deep structure alongside it.\n\n```svg\n<svg viewBox=\"0 0 660 330\" role=\"img\" aria-label=\"A surface-structure tree and a deep-structure predicate with slots for the sentence The woman bought a truck\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"165\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Surface structure (what groups with what)<\/text><text x=\"165\" y=\"48\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">S<\/text><line x1=\"165\" y1=\"54\" x2=\"95\" y2=\"86\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"165\" y1=\"54\" x2=\"240\" y2=\"86\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"95\" y=\"102\" text-anchor=\"middle\" font-size=\"13\">NP<\/text><text x=\"240\" y=\"102\" text-anchor=\"middle\" font-size=\"13\">VP<\/text><line x1=\"95\" y1=\"108\" x2=\"60\" y2=\"138\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"95\" y1=\"108\" x2=\"130\" y2=\"138\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"240\" y1=\"108\" x2=\"200\" y2=\"138\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"240\" y1=\"108\" x2=\"285\" y2=\"138\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"60\" y=\"154\" text-anchor=\"middle\" font-size=\"13\">The<\/text><text x=\"130\" y=\"154\" text-anchor=\"middle\" font-size=\"13\">woman<\/text><text x=\"200\" y=\"154\" text-anchor=\"middle\" font-size=\"13\">bought<\/text><text x=\"285\" y=\"154\" text-anchor=\"middle\" font-size=\"13\">NP<\/text><line x1=\"285\" y1=\"160\" x2=\"258\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"285\" y1=\"160\" x2=\"318\" y2=\"190\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"258\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">a<\/text><text x=\"318\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">truck<\/text><text x=\"165\" y=\"250\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">The words are grouped as /The woman/ + /bought + /a truck//.<\/text><text x=\"495\" y=\"20\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Deep structure (complete meaning)<\/text><rect x=\"445\" y=\"38\" width=\"100\" height=\"36\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"495.0\" y=\"60.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">buy<\/text><line x1=\"480\" y1=\"74\" x2=\"430\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"510\" y1=\"74\" x2=\"570\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\"/><rect x=\"365\" y=\"120\" width=\"130\" height=\"44\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"430.0\" y=\"138.125\" text-anchor=\"middle\" font-size=\"12.5\">buyer:<\/text><text x=\"430.0\" y=\"154.625\" text-anchor=\"middle\" font-size=\"12.5\">the woman<\/text><rect x=\"510\" y=\"120\" width=\"130\" height=\"44\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"575.0\" y=\"138.125\" text-anchor=\"middle\" font-size=\"12.5\">thing bought:<\/text><text x=\"575.0\" y=\"154.625\" text-anchor=\"middle\" font-size=\"12.5\">a truck<\/text><text x=\"495\" y=\"200\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">A verb brings a fixed set of slots;<\/text><text x=\"495\" y=\"217\" text-anchor=\"middle\" font-size=\"11.5\" font-style=\"italic\">the deep structure shows them all filled.<\/text><\/svg>\n```\n\n**Reading the diagram.** Left: the surface tree. S (sentence) splits into NP (noun phrase) and VP (verb phrase); the VP contains another NP. Right: the deep structure shows *buy* with its slots filled. The two are different views of the same sentence.\n\n*Part of:* [[language/the-three-native-speaker-intuitions]] · *See also:* [[language/deep-structure-and-surface-structure]]", "links": ["language/the-three-native-speaker-intuitions", "language/deep-structure-and-surface-structure"]}, {"id": "language/deep-structure-and-surface-structure", "domain": "language", "slug": "deep-structure-and-surface-structure", "title": "Deep structure and surface structure", "entry_type": "framework", "tags": ["deep-structure", "surface-structure", "derivation"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The central picture.** A sentence exists at two levels.\n\n- **Deep structure** is the complete linguistic representation of the meaning, with every slot of every verb filled and every relationship explicit.\n- **Surface structure** is the string of words actually produced, after the speaker has made a series of mostly unconscious choices, called **transformations**.\n\nThe series of choices that links the two is a **derivation**.\n\n```svg\n<svg viewBox=\"0 0 660 330\" role=\"img\" aria-label=\"Experience becomes deep structure, which transformations turn into the surface structure\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"200\" height=\"70\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"120.0\" y=\"50.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Experience<\/text><text x=\"120.0\" y=\"68.9\" text-anchor=\"middle\" font-size=\"14\">the full, rich source<\/text><rect x=\"230\" y=\"20\" width=\"200\" height=\"70\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"330.0\" y=\"50.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Deep structure<\/text><text x=\"330.0\" y=\"68.9\" text-anchor=\"middle\" font-size=\"14\">the complete linguistic version<\/text><rect x=\"440\" y=\"20\" width=\"200\" height=\"70\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"540.0\" y=\"50.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Surface structure<\/text><text x=\"540.0\" y=\"68.9\" text-anchor=\"middle\" font-size=\"14\">what is actually said<\/text><line x1=\"220\" y1=\"55\" x2=\"230\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"430\" y1=\"55\" x2=\"440\" y2=\"55\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><text x=\"335\" y=\"125\" text-anchor=\"middle\" font-size=\"12.5\" font-weight=\"600\">TRANSFORMATIONS (choices made unconsciously)<\/text><rect x=\"235\" y=\"138\" width=\"190\" height=\"34\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"330.0\" y=\"159.55\" text-anchor=\"middle\" font-size=\"13\">delete parts<\/text><rect x=\"235\" y=\"178\" width=\"190\" height=\"34\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"330.0\" y=\"199.55\" text-anchor=\"middle\" font-size=\"13\">reorder words<\/text><rect x=\"235\" y=\"218\" width=\"190\" height=\"34\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"330.0\" y=\"239.55\" text-anchor=\"middle\" font-size=\"13\">turn verbs into nouns<\/text><line x1=\"335\" y1=\"125\" x2=\"335\" y2=\"138\" stroke=\"currentColor\" stroke-width=\"1\"/><text x=\"130\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">Speaking runs left to right:<\/text><text x=\"130\" y=\"168\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">experience is reduced,<\/text><text x=\"130\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" font-style=\"italic\">then reshaped into words.<\/text><text x=\"540\" y=\"150\" text-anchor=\"middle\" font-size=\"12\" fill=\"#d9822b\" font-style=\"italic\">Listening runs the other way:<\/text><text x=\"540\" y=\"168\" text-anchor=\"middle\" font-size=\"12\" fill=\"#d9822b\" font-style=\"italic\">recover what was left out<\/text><text x=\"540\" y=\"186\" text-anchor=\"middle\" font-size=\"12\" fill=\"#d9822b\" font-style=\"italic\">to rebuild the fuller picture.<\/text><line x1=\"600\" y1=\"206\" x2=\"300\" y2=\"292\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\" stroke-dasharray=\"5 4\"/><text x=\"335\" y=\"318\" text-anchor=\"middle\" font-size=\"12.5\" fill=\"#d9822b\" font-weight=\"600\">Meta-model questions travel back from surface to deep<\/text><\/svg>\n```\n\n**What the deep level keeps and what the surface drops.** The authors say transformations change the *form* (what is left out and in what order) but do not change the *meaning* captured in the deep structure. Meaning is carried by deep structure; the surface is its shorthand.\n\n**Two relations fall out of this**, shown in [[language/synonymy-and-the-paraphrase-test]]:\n- **Synonymy**: one deep structure → several surface structures.\n- **Ambiguity** ([[language/ambiguity]]): several deep structures → one surface structure.\n\n**Below deep structure.** The authors also point out that deep structure is itself a reduction. It is derived from the speaker's full experience (later called *reference structures*), and the same three modeling processes act between experience and deep structure.\n\n**Why this is the bridge to practice.** Whenever you hear a surface sentence, you can ask \"what would the fuller version be?\" The Meta-model gives specific ways to ask. See [[meta-model/the-meta-model]].\n\n*Next:* [[language/transformations]]", "links": ["language/synonymy-and-the-paraphrase-test", "language/ambiguity", "meta-model/the-meta-model", "language/transformations"]}, {"id": "language/grammar-as-a-rewrite-system", "domain": "language", "slug": "grammar-as-a-rewrite-system", "title": "Grammar as a rewrite system", "entry_type": "concept", "tags": ["grammar", "rules", "formal-systems", "derivation"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4 end, App. A–B, Glossary (pp. 106–108, 183–218)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Idea.** A grammar can be treated as a **formal system**: a vocabulary, a starting symbol (the axiom), and rules that rewrite one symbol as others. A string of words is well formed when some chain of rewrites leads from the axiom to it. The chain is the **derivation**.\n\nA tiny rule set (simplified from the book's appendix):\n\n| Rule | Reads as |\n|---|---|\n| S → NP VP | a sentence is a noun phrase plus a verb phrase |\n| NP → Det N | a noun phrase is a determiner and a noun |\n| VP → V (NP) (PP) | a verb phrase is a verb, optionally with an object and a prepositional phrase |\n| PP → Prep NP | a prepositional phrase is a preposition and a noun phrase |\n\n```svg\n<svg viewBox=\"0 0 660 270\" role=\"img\" aria-label=\"A derivation tree for The chef tasted the soup built from rewrite rules\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"330\" y=\"18\" text-anchor=\"middle\" font-size=\"13\" font-weight=\"600\">Rewrite rules build the tree: S → NP VP,  NP → Det N,  VP → V NP<\/text><text x=\"330\" y=\"56\" text-anchor=\"middle\" font-size=\"15\" font-weight=\"600\">S<\/text><line x1=\"330\" y1=\"62\" x2=\"220\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"330\" y1=\"62\" x2=\"450\" y2=\"100\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"220\" y=\"116\" text-anchor=\"middle\" font-size=\"14\">NP<\/text><text x=\"450\" y=\"116\" text-anchor=\"middle\" font-size=\"14\">VP<\/text><line x1=\"220\" y1=\"122\" x2=\"170\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"220\" y1=\"122\" x2=\"270\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"450\" y1=\"122\" x2=\"390\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"450\" y1=\"122\" x2=\"520\" y2=\"160\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"170\" y=\"176\" text-anchor=\"middle\" font-size=\"13\">Det<\/text><text x=\"270\" y=\"176\" text-anchor=\"middle\" font-size=\"13\">N<\/text><text x=\"390\" y=\"176\" text-anchor=\"middle\" font-size=\"13\">V<\/text><text x=\"520\" y=\"176\" text-anchor=\"middle\" font-size=\"13\">NP<\/text><line x1=\"520\" y1=\"182\" x2=\"480\" y2=\"214\" stroke=\"currentColor\" stroke-width=\"1.6\"/><line x1=\"520\" y1=\"182\" x2=\"560\" y2=\"214\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"170\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">the<\/text><text x=\"270\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">chef<\/text><text x=\"390\" y=\"206\" text-anchor=\"middle\" font-size=\"13\">tasted<\/text><text x=\"480\" y=\"230\" text-anchor=\"middle\" font-size=\"13\">Det<\/text><text x=\"560\" y=\"230\" text-anchor=\"middle\" font-size=\"13\">N<\/text><text x=\"480\" y=\"256\" text-anchor=\"middle\" font-size=\"13\">the<\/text><text x=\"560\" y=\"256\" text-anchor=\"middle\" font-size=\"13\">soup<\/text><\/svg>\n```\n\n**What to take from it.**\n- Reading the rewrites top to bottom gives a **derivation**; erasing the symbols that didn't change gives a **tree**. So trees and rules are two views of the same thing ([[language/constituent-structure-and-trees]]).\n- The rules are neutral about meaning: they say which *forms* are legal ([[language/well-formedness]]), a useful reminder that structure and content are separable. The Meta-model borrows exactly that neutrality.\n- The authors warn readers not to get bogged down in the mechanics. For practical use you only need the *intuitions*, not the notation.\n\n*Part of:* [[language/deep-structure-and-surface-structure]]", "links": ["language/constituent-structure-and-trees", "language/well-formedness", "language/deep-structure-and-surface-structure"]}, {"id": "language/language-is-rule-governed", "domain": "language", "slug": "language-is-rule-governed", "title": "Language is rule-governed", "entry_type": "concept", "tags": ["rules", "grammar", "chomsky"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The authors insist on a distinction that keeps their whole approach honest: **rule-governed is not the same as determined.**\n\n- A language has infinitely many possible sentences, so the *content* of what people can say is open-ended.\n- The *forms* those sentences take are restricted and patterned, so the forms can be described by rules.\n- Describing behaviour by rules does not mean it can be predicted, or that people are mechanisms. It means there are regularities underneath the variety.\n\n**You already know the rules without being able to state them.** A child shows rule knowledge by producing regular forms, extending them to new cases, and noticing deviations in others' speech. Explaining the rule is a separate, much rarer skill. In one researcher's phrase, a native speaker must learn to *behave as though* they knew the rules.\n\n**Careful reading.** The rules in a linguist's grammar are descriptions that fit the behaviour. They are not claims about literal objects in the head.\n\n**Why the authors care.** If we can describe the patterns of how people put experience into words, we can recognise when the words have left something out. That is the doorway to the [[meta-model/the-meta-model]]. The approach comes from transformational grammar (Chomsky and followers, from 1955 on).\n\n*Related:* [[language/the-three-native-speaker-intuitions]]", "links": ["meta-model/the-meta-model", "language/the-three-native-speaker-intuitions"]}, {"id": "language/presupposition", "domain": "language", "slug": "presupposition", "title": "Presupposition", "entry_type": "concept", "tags": ["presupposition", "assumptions", "semantics"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A **presupposition** is something that must be true for a sentence to make sense at all (not that it must be *true*, just that it must be *taken as true* to interpret the sentence).\n\n**The negation test.** Add *not* to the first verb. If some other claim is still needed to make the new sentence make sense, that claim is a presupposition.\n\n| Sentence | Negated | Still needs | So it presupposes |\n|---|---|---|---|\n| *Tomás noticed the door was open.* | *Tomás didn't notice the door was open.* | The door was open. | **The door was open.** |\n| *Priya regrets that she stayed.* | *Priya doesn't regret that she stayed.* | She stayed. | **She stayed.** |\n| *There is a bird on the sill.* | *There isn't a bird on the sill.* | Nothing extra. | None. |\n\nVerbs like *realize, notice, regret, know* push their complement into the background as assumed. That is why presuppositions are sneaky: they enter the listener's picture without being offered for inspection.\n\n**Use.** To find the hidden assumptions in a person's model, run the negation test on their sentences. See [[meta-model/the-meta-model]] for how this joins the other patterns.\n\n*Part of:* [[language/the-three-native-speaker-intuitions]]", "links": ["meta-model/the-meta-model", "language/the-three-native-speaker-intuitions"]}, {"id": "language/referential-index", "domain": "language", "slug": "referential-index", "title": "Referential index", "entry_type": "concept", "tags": ["reference", "specificity", "generalization"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A word or phrase carries a **referential index** when it points to a particular thing, person or event in the speaker's experience.\n\n| Has an index | Lacks an index |\n|---|---|\n| *this page*, *Rosa*, *the Tower Bridge*, *I*, *my brother's car* | *someone*, *something*, *they*, *everyone who ever doubted me*, *it* (when unresolved) |\n\nSpeakers sort these two groups consistently. The ones that lack an index are one of the main ways **generalization** shows in language, because they refer to a category or a vague set but to nothing specific.\n\n**Why a free deletion is legal only for indexless words.** You can drop *\"to someone\"* from *\"She spoke to someone for an hour\"* without losing anything. You cannot drop *\"to her sister\"* from *\"She laughed at her sister\"* without changing the meaning. See [[language/transformations]].\n\n**Practical effect.** To get a clear image of someone's model, check each noun phrase: does it point to a particular thing? If not, the question *\"Who, specifically?\"* or *\"What, specifically?\"* asks for the index. See the Meta-model entry [[meta-model/the-meta-model]].\n\n*Part of:* [[language/the-three-native-speaker-intuitions]]", "links": ["language/transformations", "meta-model/the-meta-model", "language/the-three-native-speaker-intuitions"]}, {"id": "language/synonymy-and-the-paraphrase-test", "domain": "language", "slug": "synonymy-and-the-paraphrase-test", "title": "Synonymy and the paraphrase test", "entry_type": "concept", "tags": ["synonymy", "paraphrase", "deep-structure"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Two sentences are **synonymous** when they say the same thing in different surface forms. The model captures this by giving them **one deep structure** and different transformations.\n\n```svg\n<svg viewBox=\"0 0 660 260\" role=\"img\" aria-label=\"Synonymy maps one deep structure to several surface structures; ambiguity maps several deep structures to one surface structure\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"165\" y=\"20\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\">Synonymy: one meaning, many sentences<\/text><rect x=\"80\" y=\"32\" width=\"170\" height=\"38\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"165.0\" y=\"55.2\" text-anchor=\"middle\" font-size=\"12\">Deep: Ana wrote the report<\/text><line x1=\"130\" y1=\"70\" x2=\"70\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"165\" y1=\"70\" x2=\"165\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"200\" y1=\"70\" x2=\"260\" y2=\"120\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"5\" y=\"122\" width=\"130\" height=\"56\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"70.0\" y=\"146.2\" text-anchor=\"middle\" font-size=\"12\">Ana wrote<\/text><text x=\"70.0\" y=\"162.2\" text-anchor=\"middle\" font-size=\"12\">the report.<\/text><rect x=\"100\" y=\"122\" width=\"130\" height=\"56\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"165.0\" y=\"146.2\" text-anchor=\"middle\" font-size=\"12\">The report was<\/text><text x=\"165.0\" y=\"162.2\" text-anchor=\"middle\" font-size=\"12\">written by Ana.<\/text><rect x=\"195\" y=\"122\" width=\"130\" height=\"56\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"260.0\" y=\"146.2\" text-anchor=\"middle\" font-size=\"12\">It was Ana who<\/text><text x=\"260.0\" y=\"162.2\" text-anchor=\"middle\" font-size=\"12\">wrote the report.<\/text><text x=\"495\" y=\"20\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\">Ambiguity: one sentence, many meanings<\/text><rect x=\"380\" y=\"32\" width=\"210\" height=\"38\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"485.0\" y=\"55.025\" text-anchor=\"middle\" font-size=\"11.5\">Surface: “Visiting relatives can be tiring.”<\/text><rect x=\"350\" y=\"122\" width=\"150\" height=\"70\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"425.0\" y=\"145.525\" text-anchor=\"middle\" font-size=\"11.5\">Deep A: It can be<\/text><text x=\"425.0\" y=\"161.025\" text-anchor=\"middle\" font-size=\"11.5\">tiring when relatives<\/text><text x=\"425.0\" y=\"176.525\" text-anchor=\"middle\" font-size=\"11.5\">come to visit.<\/text><rect x=\"515\" y=\"122\" width=\"150\" height=\"70\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"590.0\" y=\"145.525\" text-anchor=\"middle\" font-size=\"11.5\">Deep B: It can be<\/text><text x=\"590.0\" y=\"161.025\" text-anchor=\"middle\" font-size=\"11.5\">tiring to go and visit<\/text><text x=\"590.0\" y=\"176.525\" text-anchor=\"middle\" font-size=\"11.5\">relatives.<\/text><line x1=\"425\" y1=\"122\" x2=\"455\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><line x1=\"590\" y1=\"122\" x2=\"520\" y2=\"70\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><\/svg>\n```\n\n**The paraphrase test.** To check whether two sentences mean the same, ask: *is there any consistent world in which one is true and the other false?* If not, they are synonyms. It is a handy check when someone says \"that's not what I said\": the surface changed, but did the meaning?\n\n**Word-order changes that preserve meaning** (permutations): active and passive (*Ana wrote the report / The report was written by Ana*), fronting (*Soup, I want*), moving the object (*gave Sam the key / gave the key to Sam*), and putting a long phrase after *it* (*It is easy to repeat this / To repeat this is easy*).\n\n*Part of:* [[language/the-three-native-speaker-intuitions]] · *Contrast:* [[language/ambiguity]]", "links": ["language/the-three-native-speaker-intuitions", "language/ambiguity"]}, {"id": "language/the-three-native-speaker-intuitions", "domain": "language", "slug": "the-three-native-speaker-intuitions", "title": "The three native-speaker intuitions", "entry_type": "framework", "tags": ["intuitions", "well-formedness", "semantics"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "The grammatical model is tested against what every native speaker *consistently knows* about their language. These intuitions come in three families.\n\n| Family | The question | Example |\n|---|---|---|\n| **Well-formedness** | Is this a sentence of my language? | \"The cat sat on the mat\" yes; \"Mat the on sat cat the\" no. |\n| **Constituent structure** | Which words go together as a unit? | In \"The old clock stopped\", *The old clock* is a unit. |\n| **Logical-semantic relations** | What does the sentence mean and presuppose? | Completeness, ambiguity, synonymy, reference, presupposition. |\n\nThe fifth item in the third family is what makes the model useful for listening to people. See:\n\n- [[language/well-formedness]]\n- [[language/constituent-structure-and-trees]]\n- [[language/verbs-and-their-slots]] (completeness)\n- [[language/ambiguity]] and [[language/synonymy-and-the-paraphrase-test]]\n- [[language/referential-index]]\n- [[language/presupposition]]\n\nThe reason intuitions matter: they are **available to you right now** without any training in grammar. The Meta-model leans on exactly that.", "links": ["language/well-formedness", "language/constituent-structure-and-trees", "language/verbs-and-their-slots", "language/ambiguity", "language/synonymy-and-the-paraphrase-test", "language/referential-index", "language/presupposition"]}, {"id": "language/transformations", "domain": "language", "slug": "transformations", "title": "Transformations", "entry_type": "concept", "tags": ["transformations", "permutation", "deletion", "nominalization"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A **transformation** is a stated pattern linking a deep structure to a surface form. There are three kinds that matter here.\n\n**1. Permutation.** The word order changes, the meaning does not.\n- *The dog chased the cat. / The cat was chased by the dog.* (passive)\n- *Tea, I like. / I like tea.* (fronting)\n\n**2. Deletion.** Material present in the deep structure fails to appear in the surface.\n- **Free deletion** removes an *indefinite* element: *\"He ate something\" → \"He ate.\"* Safe, because the dropped item had no particular referent.\n- **Identity deletion** removes a *definite* element that is repeated: *\"Mei went to the market and Jun went to the market\" → \"Mei went to the market and Jun did too.\"* Safe, because the copy that remains preserves the information.\n- Dropping a definite, specific element with no copy left behind **changes the meaning** (\"She laughed at her sister\" → \"She laughed\").\n\n**3. Nominalization.** A process word (verb) is changed to an event word (noun).\n- *\"Dev knows that he fears failing\"* → *\"Dev knows his fear of failing.\"*\n- *decide → decision, resent → resentment, relate → relationship.*\n\nNominalization can be combined with permutation and deletion, ending in sentences like *\"Dev knows the fear.\"* All three alter the *form* and, in the case of the latter two, make the speaker's model look different from the full version.\n\n**Why you should care.** Each transformation is a place where something was left out or frozen. Listening for them is the first half of the [[meta-model/the-meta-model]].\n\n*Part of:* [[language/deep-structure-and-surface-structure]] · *See also:* [[language/referential-index]], [[language/verbs-and-their-slots]]", "links": ["meta-model/the-meta-model", "language/deep-structure-and-surface-structure", "language/referential-index", "language/verbs-and-their-slots"]}, {"id": "language/two-uses-of-language", "domain": "language", "slug": "two-uses-of-language", "title": "Two uses of language", "entry_type": "concept", "tags": ["representation", "communication", "language"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "We use language in two linked ways:\n\n1. **To represent** experience to ourselves: thinking, reasoning, imagining, rehearsing. This builds our model of the world.\n2. **To communicate** that model to others: talking, writing, teaching, singing.\n\nCommunication is really a special case of representation: it is the representation of *our representation*, offered to someone else. The first is private, the second social.\n\nBoth uses are subject to the same three limits from [[perception/generalization-deletion-and-distortion]]. A sentence is a model of a model, so it deletes, generalizes and distorts at least twice.\n\n**We're like fish in water here.** We seldom notice the choosing of words or their ordering. Yet the process is highly structured, which you can feel by scrambling a sentence:\n\n> Original: *Rules decide which word groups carry a meaning.*\n> Scrambled: *\\*Meaning which carry groups word decide rules.*\n\nThe scrambled version has the same words and none of the sense. (The asterisk marks a sequence that is not well formed.)\n\n*Next:* [[language/language-is-rule-governed]], [[language/deep-structure-and-surface-structure]]", "links": ["perception/generalization-deletion-and-distortion", "language/language-is-rule-governed", "language/deep-structure-and-surface-structure"]}, {"id": "language/verbs-and-their-slots", "domain": "language", "slug": "verbs-and-their-slots", "title": "Verbs and their slots", "entry_type": "concept", "tags": ["verbs", "arguments", "completeness", "valency"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Every verb implies a fixed number of participants. Speakers know this without being taught.\n\n| Verb | Slots it brings |\n|---|---|\n| *sleep* | one: who sleeps |\n| *hug* | two: who hugs, who is hugged |\n| *hand* | three: who gives, what is given, who receives |\n| *cut* | up to three: who cuts, what is cut, with what |\n\n**Why it matters.** When a sentence shows *fewer* slots than the verb carries, something has been left out in the surface. Hearing \"I'm worried\" you can ask yourself: *worried* about what, because of whom? That is the quickest test for a **deletion** in the Meta-model: \"Can I think of a well-formed sentence with the same verb and more noun phrases?\" If yes, the original is incomplete.\n\nNouns that fill the slots are called *noun phrases* or *arguments*; the verb is the *predicate*. This is why the authors speak of \"process words\" (verbs) and the \"noun arguments\" they carry.\n\n*Part of:* [[language/the-three-native-speaker-intuitions]] · *Used by:* [[language/transformations]]", "links": ["language/the-three-native-speaker-intuitions", "language/transformations"]}, {"id": "language/well-formedness", "domain": "language", "slug": "well-formedness", "title": "Well-formedness", "entry_type": "concept", "tags": ["grammaticality", "syntax", "semantics"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Warning to the Reader and Ch. 2 (pp. 1–2, 21–38)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Native speakers sort word strings into well-formed and not, and they agree with each other and with themselves over time. There are two ways to fail:\n\n| Type | Example | What happens |\n|---|---|---|\n| **Fine** | *The mayor has a cold.* | Reads as a normal sentence. |\n| **Semantically ill-formed** | *The mayor has a purple Tuesday.* | The grammar is fine, but nothing recognisable is meant. |\n| **Syntactically ill-formed** | *The mayor have a cold.* | You can guess a meaning, but the form is broken. |\n\nA sentence is well formed when there is some series of [[language/transformations]] that carries a complete [[language/deep-structure-and-surface-structure]] into it.\n\n**A twist for later.** The authors extend the idea: beyond English well-formedness, there is a narrower set of sentences that are well formed *for the purpose of change*. See [[meta-model/well-formed-for-change]].\n\n*Part of:* [[language/the-three-native-speaker-intuitions]]", "links": ["language/transformations", "language/deep-structure-and-surface-structure", "meta-model/well-formed-for-change", "language/the-three-native-speaker-intuitions"]}, {"id": "meta-model/accept-ask-or-guess", "domain": "meta-model", "slug": "accept-ask-or-guess", "title": "Accept, ask or guess", "entry_type": "technique", "tags": ["responses", "question-choice", "congruity"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 3 (pp. 39–55)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Whenever a sentence is thinner than its full version, the listener has three options. The authors treat this as the basic choice point.\n\n| Option | What you do | Trade-off |\n|---|---|---|\n| **Accept** | Take the thin version as it is. | Feels easy, but the speaker must find the missing part alone and change is slow. |\n| **Ask** | Request the missing piece. | Reveals either the answer or that the gap exists in the speaker's own model, and engages the speaker in discovery. |\n| **Guess** | Offer what you think fills the gap. | Quicker, but a wrong guess puts your map into their mouth. |\n\n**Example (new).** Speaker: *\"I'm dreading it.\"*\n- Ask: *\"Dreading what, exactly?\"*\n- Guess, with the safeguard below: *\"Try saying: 'I dread the review on Friday.' Does that fit?\"*\n\n**The safeguard for guessing.** Do not assert your guess. Invite the speaker to *say* the sentence that contains it and notice whether it fits. A fitting sentence feels like recognition; a wrong one jars. The speaker's own sense of fit is the judge, not you.\n\nThis is later developed as the *congruity technique*. The authors support the caution with a remark from other therapists: do not push or seduce someone into behaviour they have not themselves prepared.\n\n**Why asking is the default.** A good answer fills the gap for you both. A blank answer shows the gap is in the speaker's own picture, which is where the real work starts.\n\n*Part of:* [[meta-model/the-meta-model]] · *See also:* [[meta-model/ask-how-not-why]]", "links": ["meta-model/the-meta-model", "meta-model/ask-how-not-why"]}, {"id": "meta-model/ask-how-not-why", "domain": "meta-model", "slug": "ask-how-not-why", "title": "Ask how, not why", "entry_type": "technique", "tags": ["how-questions", "process", "justification"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 3 (pp. 39–55)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "When you probe, ask for **process** (\"how\") answers instead of **justification** (\"why\") answers.\n\n| Question | Typical answer | Effect |\n|---|---|---|\n| *Why are you afraid of him?* | \"Because he's like that.\" | A reason, a story, often a new generalization. |\n| *How, specifically, does he scare you?* | \"He goes quiet and looks at me for a while.\" | A concrete sequence you both can see. |\n\n**Why it works.** A \"how\" answer reconnects the generalization with the experience it grew from, and gives you something with referential indices and verbs you can work on. A \"why\" answer tends to be a model-supporting explanation. It adds more map, not more territory.\n\nThe authors list this as a general tip in the notes: *demand how-answers, not why-answers*, for the questions used in [[meta-model/the-meta-model]].\n\n**Caution.** In ordinary conversation, \"why\" can sound like blame. \"How\" is gentler because it asks for a description, not a defence.\n\n*Related:* [[meta-model/accept-ask-or-guess]]", "links": ["meta-model/the-meta-model", "meta-model/accept-ask-or-guess"]}, {"id": "meta-model/don-t-advise-into-the-gap", "domain": "meta-model", "slug": "don-t-advise-into-the-gap", "title": "Don't advise into the gap", "entry_type": "caution", "tags": ["advice", "resistance", "deletion"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 3 (pp. 39–55)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The pattern.** You hear a limited model, see an obvious option the person has missed, and offer it. Very often it is brushed off or does not land.\n\n**Why.** Where someone's model has a deletion, the missing options are exactly the ones the speaker cannot currently see. Advice that lands in that gap lands on blank ground. The speaker either \"resists\" or does not hear it.\n\n**What to do instead.**\n- Hold your suggestion.\n- Use questions that help the speaker find the options themselves ([[meta-model/the-meta-model]]).\n- Wait until their model is rich enough to contain your idea. At that point it may no longer be needed, because they will have their own.\n\n**Side benefit the authors note.** Not suggesting keeps you out of content and in the process of *how the person handles the problem*, which is the thing you can actually influence.\n\n**A new example.** A friend says \"I just can't speak up in those meetings.\" Instead of \"just raise your hand\", try *\"What would happen if you did?\"* Their answer shows the deleted part (a feared outcome) and gives you something to work with.\n\n*Related:* [[perception/impoverished-models-and-few-choices]], [[meta-model/accept-ask-or-guess]]", "links": ["meta-model/the-meta-model", "perception/impoverished-models-and-few-choices", "meta-model/accept-ask-or-guess"]}, {"id": "meta-model/glossary-of-meta-model-terms", "domain": "meta-model", "slug": "glossary-of-meta-model-terms", "title": "Glossary of Meta-model terms", "entry_type": "glossary", "tags": ["glossary", "terms", "definitions"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4 end, App. A–B, Glossary (pp. 106–108, 183–218)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Plain-language definitions of the book's vocabulary, in my wording.\n\n| Term | Meaning |\n|---|---|\n| **Ambiguity** | One sentence with more than one meaning. |\n| **Analogical** | Continuous communication such as tone of voice and body movement. |\n| **Completeness** | Whether a sentence carries every piece its deep structure has. |\n| **Deep structure** | The fullest linguistic version of what a sentence means. |\n| **Deletion** | Parts of the world (or of the deep structure) left out of the model (or the sentence). |\n| **Digital** | Discrete, symbolic communication. Language is the main case. |\n| **Distortion** | Relationships among the parts are represented differently from reality, e.g., a process presented as a thing. |\n| **Enrichment** | Adding distinctions to a model; in practice, gaining choices. |\n| **Extensional** | Defined by listing the members. |\n| **Intensional** | Defined by a rule or description of the members. |\n| **Explicit** | Stated step by step, not left to interpretation. |\n| **Formal** | Used two ways: explicit, and independent of content. |\n| **Generalization** | One experience stands for a whole category. |\n| **Impoverishment** | Shrinking the distinctions in a model and thus the choices. |\n| **Intuition** | A consistent judgment by speakers about their language, usually made without being able to explain it. |\n| **Meta-model** | A model of a model. |\n| **Modal operator** | A word of necessity or possibility (*must, can't*), marking a rule or limit. |\n| **Nominalization** | A process turned into a noun-like event. |\n| **Presupposition** | What must be assumed for a sentence to make sense. |\n| **Referential index** | The marker that a word points to something specific in the speaker's experience. |\n| **Reference structure** | The sum of the speaker's experience from which deep structure derives. |\n| **Surface structure** | The sentence actually said. |\n| **Transformation** | A rule connecting deep structure to surface structure. |\n| **Well-formed in therapy** | A sentence meeting the seven conditions in [[meta-model/well-formed-for-change]]. |\n\n*Companion entries:* [[language/deep-structure-and-surface-structure]], [[perception/generalization-deletion-and-distortion]]", "links": ["meta-model/well-formed-for-change", "language/deep-structure-and-surface-structure", "perception/generalization-deletion-and-distortion"]}, {"id": "meta-model/separate-what-is-said-from-what-you-supply", "domain": "meta-model", "slug": "separate-what-is-said-from-what-you-supply", "title": "Separate what is said from what you supply", "entry_type": "technique", "tags": ["listening", "projection", "discipline"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**The skill.** Before you work with anyone's words, notice which parts of your mental picture came *from them* and which *you added*.\n\n**Try it.** Read the sentence below, close your eyes, and picture it.\n\n> *\"I'm worried.\"*\n\nYou will see a person and an act of worrying. Anything more (a boss, a deadline, a family member) was supplied by you. Now try:\n\n> *\"Jo let me down.\"*\n\nThe verb *let down* is vague. You probably pictured something specific (a missed meeting, a broken promise, a silence). That picture is your own filler. Jo's actual meaning could be any of a dozen.\n\n**Why this matters.**\n- Your guess may or may not fit the other person's model. If you proceed as if it does, you are talking to your own map.\n- Even when your guess is accurate, the *speaker* has not said it. The spot where you filled in is the spot where a question can help them.\n- The more experienced you are, the easier it is to fill gaps confidently, so the habit of checking gets *more* important with experience.\n\n**Practice recipe.** After hearing a sentence, list three details in your picture. Mark each: *said* or *supplied*. Whatever you supplied is a candidate question.\n\n*Part of:* [[meta-model/the-meta-model]] · *Leads to:* [[meta-model/deletion/unspecified-slots]]", "links": ["meta-model/the-meta-model", "meta-model/deletion/unspecified-slots"]}, {"id": "meta-model/the-meta-model", "domain": "meta-model", "slug": "the-meta-model", "title": "The Meta-model", "entry_type": "framework", "tags": ["meta-model", "overview", "listening"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 3 (pp. 39–55)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "A **Meta-model** is a model of a model. Language is a model of the speaker's experience; a description of how language represents experience is a model of that model. The authors adapt the transformational grammar model into a Meta-model for noticing and working with the *impoverished* parts of someone's model.\n\n**Why it is useful.**\n- It is built on intuitions every native speaker already has, so it is learnable.\n- It works regardless of school, topic or content. It asks about the *form* of what is said.\n- It gives an explicit procedure: check each sentence against what a complete version would hold.\n\n**The method in three moves.**\n1. **Listen** for the spots where a sentence is thinner than its deep structure would be.\n2. **Choose** one of three responses: accept the thin version, ask for the missing part, or guess ([[meta-model/accept-ask-or-guess]]).\n3. **Help the speaker reconnect** the sentence with the experience it came from, so the model gains specifics and options.\n\n**Three pattern families** (each a subdomain here), matching [[perception/generalization-deletion-and-distortion]]:\n\n| Family | The speaker's sentence has... | Question aim |\n|---|---|---|\n| [[meta-model/deletion/deletion-patterns-at-a-glance]] | missing pieces | recover them |\n| [[meta-model/generalization/generalization-patterns-at-a-glance]] | vague or absolute terms, limits | tie to specifics, test the limit |\n| [[meta-model/distortion/distortion-patterns-at-a-glance]] | processes frozen as events, forced causes, assumed presuppositions | restore process and ownership |\n\n**Overall target.** [[meta-model/well-formed-for-change]] lists the seven conditions a sentence should meet before further work is needed.\n\n**Scope of this book.** Volume I focuses on the verbal (digital) side. The authors say the same principles carry over to non-verbal behaviour, which is taken up in volume II.\n\n*Foundations:* [[perception/map-and-territory]], [[language/deep-structure-and-surface-structure]]", "links": ["meta-model/accept-ask-or-guess", "perception/generalization-deletion-and-distortion", "meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/distortion/distortion-patterns-at-a-glance", "meta-model/well-formed-for-change", "perception/map-and-territory", "language/deep-structure-and-surface-structure"]}, {"id": "meta-model/well-formed-for-change", "domain": "meta-model", "slug": "well-formed-for-change", "title": "Well-formed for change", "entry_type": "framework", "tags": ["well-formedness", "checklist", "conditions"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 3 (pp. 39–55)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Among all well-formed English sentences there is a smaller set that is well formed **for the purpose of change**. A sentence belongs to it when it meets seven conditions. Use the list as a checklist when listening.\n\n| # | Condition | The failing pattern |\n|---|---|---|\n| 1 | Well formed in ordinary English | (baseline) |\n| 2 | No unexplored **deletions** where the speaker feels no choice | missing slots |\n| 3 | No **nominalizations** | processes frozen into things |\n| 4 | No words or phrases **lacking a referential index** | vague nouns, universal terms |\n| 5 | No **incompletely specified verbs** | verbs that do not say how |\n| 6 | No unexplored **presuppositions** where the speaker feels no choice | hidden assumptions |\n| 7 | No violations of **semantic well-formedness** | impossible causes (\"you make me feel\") |\n\nTwo qualifiers matter: the conditions apply **where the speaker experiences no choice**. Elsewhere, shorthand is fine.\n\n**Why it is useful.** Hearing a sentence, you can run through the list quickly and find which question is worth asking. Conditions 2, 4 and 5 are mostly about missing pieces; 3, 6 and 7 are about twisted ones.\n\n**Reminder.** The checklist is for finding places to ask, not for correcting people's grammar.\n\n*Part of:* [[meta-model/the-meta-model]] · *Compare:* [[language/well-formedness]]", "links": ["meta-model/the-meta-model", "language/well-formedness"]}, {"id": "meta-model/deletion/ly-adverbs", "domain": "meta-model/deletion", "slug": "ly-adverbs", "title": "-ly adverbs", "entry_type": "pattern", "tags": ["deletion", "adverbs", "opinions-as-facts"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Cue.** Adverbs ending in *-ly* at the front or middle of a sentence: *obviously, clearly, unfortunately, sadly, surprisingly, painfully.*\n\n**Why they hide something.** Many of them are shorthand for \"it is X that...\", which has a slot for *whom*. *\"Clearly, the budget is wasted\"* means *\"It is clear that the budget is wasted\"*, and the question *\"clear to whom?\"* has no answer in the sentence. The statement slips an opinion in as a fact.\n\n**Paraphrase test.**\n1. Drop the *-ly* and put the root at the front.\n2. Add *\"It is...\"* before it.\n3. Ask: does the new sentence mean the same as the original?\n\nIf yes, the adverb came from a verb or adjective that had hidden arguments. Then use the normal recovering questions on the new sentence.\n\n| Spoken | Rewritten | Ask |\n|---|---|---|\n| *Obviously, nobody cares.* | It is obvious that nobody cares. | obvious to whom? |\n| *Sadly, she left early.* | It is sad that she left early. | sad for whom? |\n| *They wisely avoided it.* | It is wise that they avoided it. | wise by whose standard? |\n| *He drove quickly.* | (not synonymous) | not this pattern |\n\n**Beware the last row.** Manner adverbs that describe *how* an action was done often fail the test. The test separates opinion-markers from description.\n\n**Use in everyday talk.** Whenever you notice yourself or someone else starting a sentence with \"clearly\" or \"obviously\", treat it as a flag: whose view is being dressed up as a fact?\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]]", "links": ["meta-model/deletion/deletion-patterns-at-a-glance"]}, {"id": "meta-model/deletion/adjectives-that-hide-verbs", "domain": "meta-model/deletion", "slug": "adjectives-that-hide-verbs", "title": "Adjectives that hide verbs", "entry_type": "pattern", "tags": ["deletion", "adjectives", "participles"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "Many adjectives and *-ing / -ed* words are verbs in disguise. When they sit in front of a noun they hide the people and reasons involved.\n\n| Surface | Hidden verb | Fuller version (new) |\n|---|---|---|\n| *I dislike evasive managers.* | evade | managers who evade **me** about **what I need** |\n| *Her thoughtless remark stung.* | (not) think | the remark she made without thinking **of me** stung |\n| *An exhausting schedule.* | exhaust | a schedule that exhausts **us**, **by doing what** |\n| *The frustrated team left.* | frustrate | the team that **the delays** frustrated left |\n\n**The move.** Turn the adjective back into its verb or a relative clause (*managers who are evasive*) and ask the slot questions:\n\n- *Evasive to whom? about what?*\n- *Frustrated by what?*\n- *Exhausting for whom?*\n\n**Why it matters.** The adjective sounds like a property of the person or thing, as in *\"unclear people\"*. Restoring the verb shows it as a **relationship**: unclear *to me*, *about this*. That alone can change how a complaint is understood.\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]] · *Related:* [[meta-model/deletion/unspecified-slots]]", "links": ["meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/deletion/unspecified-slots"]}, {"id": "meta-model/deletion/comparatives-and-superlatives", "domain": "meta-model/deletion", "slug": "comparatives-and-superlatives", "title": "Comparatives and superlatives", "entry_type": "pattern", "tags": ["deletion", "comparison", "standards"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Cue.** Words ending in *-er* or *-est*, or built with *more / less / most / least*: *better, fastest, more reliable, least qualified.*\n\n**What is deleted.** One side of the comparison, or the whole set the superlative picks from.\n\n| Spoken | Missing piece |\n|---|---|\n| *This plan is better.* | better than what? |\n| *He's a more careful driver.* | more careful than whom? |\n| *That was the worst meeting.* | worst out of which meetings, judged how? |\n| *She's the best candidate.* | best compared to whom, by what measure? |\n\n**Questions.**\n- Comparative: **\"[adjective] compared to what?\"** or **\"... than whom?\"**\n- Superlative: **\"[adjective] with respect to what?\"**\n\n**Procedure.**\n1. Listen for the comparative or superlative marker.\n2. Check whether both sides are present (comparative) or whether the reference set is named (superlative).\n3. Where not, ask the matching question.\n\n**Why it matters.** A claim like \"this is the right approach\" or \"he's too aggressive\" carries a **standard** that nobody has stated. It quietly sets the terms of the whole discussion, so surfacing it often resolves arguments that were really about different yardsticks.\n\n*Footnote from the earlier chapter:* a phrase like \"the right approach\" is itself incomplete: right for whom, by what test, compared to what? ([[perception/map-and-territory]])\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]]", "links": ["perception/map-and-territory", "meta-model/deletion/deletion-patterns-at-a-glance"]}, {"id": "meta-model/deletion/deletion-patterns-at-a-glance", "domain": "meta-model/deletion", "slug": "deletion-patterns-at-a-glance", "title": "Deletion patterns at a glance", "entry_type": "framework", "tags": ["deletion", "overview", "index"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Idea.** Deletion removes pieces of experience from the model, or from the full linguistic version of it. In speech this shows as sentences with fewer parts than their verbs need. The purpose of noticing is to help the speaker restore a **fuller picture**.\n\n**Five patterns the book teaches under deletion:**\n\n| Pattern | What it sounds like | The recovering question |\n|---|---|---|\n| [[meta-model/deletion/unspecified-slots]] | *\"I'm annoyed.\"* | annoyed about whom or what? |\n| [[meta-model/deletion/adjectives-that-hide-verbs]] | *\"unhelpful people\"* | unhelpful to whom, about what? |\n| [[meta-model/deletion/comparatives-and-superlatives]] | *\"This one is better.\"* | better compared to what? |\n| [[meta-model/deletion/ly-adverbs]] | *\"Clearly, they ignore me.\"* | clear to whom? |\n| [[meta-model/deletion/modal-operators-of-necessity]] and [[meta-model/deletion/modal-operators-of-possibility]] | *\"I must / I can't\"* | or what? what stops you? |\n\n**Where the book places modal operators.** Under deletion, because each one hides a consequence or a cause. They also express *rules* that the speaker has made from experience, so they are a bridge to [[meta-model/generalization/generalization-patterns-at-a-glance]].\n\n```svg\n<svg viewBox=\"0 0 640 200\" role=\"img\" aria-label=\"A sentence with open slots that the speaker did not fill\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><text x=\"320\" y=\"22\" text-anchor=\"middle\" font-size=\"13.5\" font-weight=\"600\">The sentence says one thing; the verb offers more slots<\/text><rect x=\"20\" y=\"40\" width=\"120\" height=\"44\" rx=\"9\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.6\"/><text x=\"80.0\" y=\"66.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">I<\/text><rect x=\"150\" y=\"40\" width=\"150\" height=\"44\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"225.0\" y=\"66.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">am anxious<\/text><rect x=\"310\" y=\"40\" width=\"150\" height=\"44\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"385.0\" y=\"66.9\" text-anchor=\"middle\" font-size=\"14\">about ____<\/text><rect x=\"470\" y=\"40\" width=\"150\" height=\"44\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\" stroke-dasharray=\"5 4\"/><text x=\"545.0\" y=\"66.9\" text-anchor=\"middle\" font-size=\"14\">because of ____<\/text><text x=\"320\" y=\"112\" text-anchor=\"middle\" font-size=\"13\">Spoken (surface):  “I am anxious.”<\/text><text x=\"320\" y=\"134\" text-anchor=\"middle\" font-size=\"13\">Full (deep): who is anxious, about what, caused by what<\/text><line x1=\"385\" y1=\"148\" x2=\"385\" y2=\"172\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\" stroke-dasharray=\"5 4\"/><text x=\"385\" y=\"192\" text-anchor=\"middle\" font-size=\"13\" fill=\"#d9822b\" font-weight=\"600\">Ask: about what? because of whom or what?<\/text><\/svg>\n```\n\n**Reading the list as a procedure.** Go through a sentence with three checks: verbs (are any slots empty?), modifiers (do adjectives, adverbs or comparatives hide a person or a standard?), and rule-words (does a must or a can't announce a rule?).\n\n*Part of:* [[meta-model/the-meta-model]] · *Foundation:* [[language/verbs-and-their-slots]], [[language/transformations]]", "links": ["meta-model/deletion/unspecified-slots", "meta-model/deletion/adjectives-that-hide-verbs", "meta-model/deletion/comparatives-and-superlatives", "meta-model/deletion/ly-adverbs", "meta-model/deletion/modal-operators-of-necessity", "meta-model/deletion/modal-operators-of-possibility", "meta-model/generalization/generalization-patterns-at-a-glance", "meta-model/the-meta-model", "language/verbs-and-their-slots", "language/transformations"]}, {"id": "meta-model/deletion/modal-operators-of-necessity", "domain": "meta-model/deletion", "slug": "modal-operators-of-necessity", "title": "Modal operators of necessity", "entry_type": "pattern", "tags": ["deletion", "rules", "necessity", "must", "should"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Cue words.** *have to, must, should, ought, need to, it is necessary, one must, you've got to, necessarily.*\n\n**What they announce.** A **rule** the speaker holds: something has to happen. The sentence leaves out what follows if the rule is broken. In logical shape: *it is necessary that S1, or else S2*, with S2 deleted.\n\n```svg\n<svg viewBox=\"0 0 640 230\" role=\"img\" aria-label=\"Modal operators of necessity and possibility with the questions that recover what is missing\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"system-ui,-apple-system,sans-serif\" font-size=\"14\" fill=\"currentColor\"><defs><marker id=\"ar\" viewBox=\"0 0 10 10\" refX=\"9\" refY=\"5\" markerWidth=\"7\" markerHeight=\"7\" orient=\"auto-start-reverse\"><path d=\"M0 0L10 5L0 10z\" fill=\"currentColor\"/><\/marker><\/defs><rect x=\"20\" y=\"20\" width=\"260\" height=\"60\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"150.0\" y=\"45.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Necessity words<\/text><text x=\"150.0\" y=\"63.9\" text-anchor=\"middle\" font-size=\"14\">must, have to, should, necessary<\/text><line x1=\"150\" y1=\"80\" x2=\"150\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"20\" y=\"120\" width=\"260\" height=\"60\" rx=\"9\" fill=\"#3b82c4\" fill-opacity=\".14\" stroke=\"#3b82c4\" stroke-width=\"1.6\"/><text x=\"150.0\" y=\"145.9\" text-anchor=\"middle\" font-size=\"14\">“Or what will happen?”<\/text><text x=\"150.0\" y=\"163.9\" text-anchor=\"middle\" font-size=\"14\">asks for the feared consequence<\/text><rect x=\"360\" y=\"20\" width=\"260\" height=\"60\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"490.0\" y=\"45.9\" text-anchor=\"middle\" font-size=\"14\" font-weight=\"600\">Possibility words<\/text><text x=\"490.0\" y=\"63.9\" text-anchor=\"middle\" font-size=\"14\">can't, impossible, unable, no one can<\/text><line x1=\"490\" y1=\"80\" x2=\"490\" y2=\"118\" stroke=\"currentColor\" stroke-width=\"1.6\" marker-end=\"url(#ar)\"/><rect x=\"360\" y=\"120\" width=\"260\" height=\"60\" rx=\"9\" fill=\"#d9822b\" fill-opacity=\".14\" stroke=\"#d9822b\" stroke-width=\"1.6\"/><text x=\"490.0\" y=\"145.9\" text-anchor=\"middle\" font-size=\"14\">“What stops you?”<\/text><text x=\"490.0\" y=\"163.9\" text-anchor=\"middle\" font-size=\"14\">asks for the blocking cause<\/text><text x=\"320\" y=\"214\" text-anchor=\"middle\" font-size=\"12.5\" font-style=\"italic\">Both questions bring back a cause or consequence the sentence left out<\/text><\/svg>\n```\n\n**Recovering questions.**\n- **\"Or what will happen?\"**\n- **\"What would happen if you didn't [do the thing]?\"**\n\n**Examples (new).**\n\n| Said | Ask |\n|---|---|\n| *I have to say yes to every request.* | What would happen if you said no to one? |\n| *You should never show doubt in front of a client.* | What would happen if you did? |\n| *We must keep everything perfectly consistent.* | And if it were not consistent? |\n| *One has to be liked.* | What happens if one isn't? |\n\n**What you learn.** The answer is usually a fear, a picture of consequences. It tells you what the rule protects and, often, that the feared outcome is smaller or less certain than the rule implies. It also shows the speaker's rule *as a rule* and not as a law of nature.\n\n**Caution.** Not every \"should\" needs probing; \"I have to catch the 8:15 train\" is ordinary. Probe where the rule limits choice or seems out of proportion.\n\n*Part of:* [[meta-model/deletion/deletion-patterns-at-a-glance]] · *Pair:* [[meta-model/deletion/modal-operators-of-possibility]] · *Bridge to:* [[meta-model/generalization/generalization-patterns-at-a-glance]]", "links": ["meta-model/deletion/deletion-patterns-at-a-glance", "meta-model/deletion/modal-operators-of-possibility", "meta-model/generalization/generalization-patterns-at-a-glance"]}, {"id": "meta-model/deletion/modal-operators-of-possibility", "domain": "meta-model/deletion", "slug": "modal-operators-of-possibility", "title": "Modal operators of possibility", "entry_type": "pattern", "tags": ["deletion", "rules", "limits", "cant", "impossible"], "source": "Richard Bandler and John Grinder, The Structure of Magic I: A Book about Language and Therapy (Science and Behavior Books, 1975), Ch. 4, Deletion (pp. 57–73)", "pulled_from": null, "created": "2026-10-14", "updated": "2026-10-14", "body": "**Cue words.** *can't, cannot, unable, impossible, not possible, no one can, nobody is able, may not, there's no way.*\n\n**What they announce.** A **limit** in the speaker's model: something is impossible. The sentence leaves out *what makes it impossible*. In logical shape: *S1 prevents S2 from being possible*, with S1 deleted.\n\n**Recovering questions.**\n- **\"What stops you from [doing it]?\"**\n- \"What prevents you / blocks you / makes it impossible?\"\n\n**Examples (new).**\n\n| Said | Ask |\n|---|---|\n| *I can't ask for a raise.* | What stops you from asking? |\n| *It's impossible to relax on holiday.* | What prevents you from relaxing? |\n| *Nobody can tell the truth here.* | What makes telling the truth impossible? |\n| *I'm unable to start.* | What blocks you from starting? |\n\n**A companion question.** Also: *\"What would happen if you did?\"* The first asks about the block, the second about the feared result. Together they map the edge of the model.\n\n**Why this pattern is prized.
